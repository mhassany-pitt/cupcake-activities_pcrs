statement: |-
  Given an array of ints and two ints n and m, return true if n
  and m occur next to each ohter (in any order) in the array.
  For example:

  ```
  containsNM({1,2,3}, 2, 3) => true
  containsNM({1,2,3}, 3, 4) => false
  containsNM({7, 8, 3}, 3, 8) => true
  containsNM({}, 7, 3) => false
  ```
