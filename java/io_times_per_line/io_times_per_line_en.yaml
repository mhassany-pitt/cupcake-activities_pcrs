statement: |-
  Please complete the following method `timesPerLine(BufferedReader reader, String word)` in order to calculate how many times the word given as input appears on each line of a given file. You need to return this information as an ArrayList or Integers, where the first element will be the number of times that `word` appears in the first line, the second element will be the number of times that `word` appears in the second line, and so on. Assume that within each line, words are separated by a single whitespace.

  The method receives a `BufferedReader` object as input, so you need to assume that the initialization of the `BufferedReader` object with a `FileReader` object was already done so you do not need to take care of it.

  Hint: you can use the method split() to separate each line in multiple fields.

  E.g.
  Input:
  `
  This is a test file
  in where we will test how
  many times the word
  test appears in this test scenario.
  `
  `timesPerLine(reader, "test") -> [1,1,0,2]`

  Important: If an empty file is provided, the method must return an ArrayList initialized but with no elements on it.
