statement: "Complete the following code for overloading the constructors of the class Grade. Additionally, you need to implement\
  \ the missing getters/setters for the three attributes of the class. For this task, you need to consider the following grade\
  \ conversion table:\n\nLetter grade | Percent grade\nA+: 97-100\nA: 93-96\nA-: 90-92\nB+: 87-89\nB: 83-86\nB-: 80-82\nC+:\
  \ 77-79\nC: 73-76\nC-: 70-72\nD+: 67-69\nD: 63-66\nD-: 60-62\nF: Below 60\n\nConstructors definition:\n+ Grade(studentID:\
  \ String) -> this one will set the percentGrade as 0 and letterGrade as F\n+ Grade(studentID: String, percent: int) \n+\
  \ Grade(studentID: String, letter: char, sign: char) -> this one will set letterGrade as the concatenation of `letter` and\
  \ `sign`, and the percent score as the upper limit of the corresponding range (e.g. if `letter` score is B+, `percent` will\
  \ be equals to 89). If second parameter is ' ', do not concatenate (keep the single letter given as first parameter as it\
  \ is).\n\nImportant: you need to control that the Grade objects created (as well as getters/setters) accept grades only\
  \ within the specified range (`percentScore` from 0 to 100,  `letterGrade` with first character from 'A' to 'F' and the\
  \ second character has to be either '+', '-' or ' ' - the last one represents when the letter grade has no sign associated).\
  \ In case the constructor is passed with a parameter outside the feasible range, you need to set the `percentGrade` as 0\
  \ and `letterGrade` as F.\n\nMore instructions on how to implement the missing parts of this class are provided in the code\
  \ below."
