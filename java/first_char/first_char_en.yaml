statement: |-
  Complete the following program in order to print to the console the first character of a string entered by a user from the keyboard. Assume that the string entered by the user is at least 1-character long.

  **Important:** Note that you have to define a variable named `firstChar` to store the first character of the user input, which is printed to the console in the last part of the code below.
elements:
- type: locked
  location:
    snippet: "import java.util.Scanner;\n\npublic class Lab2 {\n    public static void main(String[] args){\n        // Create\
      \ a scanner to read from keyboard\n        Scanner kbd = new Scanner (System.in);\n        \n        // Prompt user\
      \ for typing text input\n        System.out.print(\"Enter any string ( e.g your name): \");\n        //Store user input\
      \ in a String variable\n        String s = kbd.nextLine();\n        System.out.println(\"You entered \" + s);\n    \
      \    \n        //YOU MUST NOT WRITE ANY CODE ABOVE THIS LINE"
- type: editable
