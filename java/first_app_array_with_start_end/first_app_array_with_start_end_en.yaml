statement: |-
  Complete the following method which takes the following parameters (in this order):

  - an array of integers `arr`,
  - an integer `count`,
  - an integer `startingAt`,
  - an integer `stoppingAt`,
  - and an integer `key`,

  the method has to return the index where the integer `key`appears for the first time within the range delimited by positions `startingAt` and `stoppingAt`, but ONLY considering the `count` contiguous elements to the integer in the position `startingAt`. In case the integer `key` does not appear in the specified range of the array, the method must return -1. For example:

  ```
  indOfFirst( {1,2,3,4,5,6} , 3 , 1 , 2 , 3 ) => 2
  indOfFirst( {1,2,4,3,5,7} , 4 , 0 , 2 , 3 ) => -1
  indOfFirst( {3,2}, 1 , 0 , 0 , 3 ) => 0
  ```
