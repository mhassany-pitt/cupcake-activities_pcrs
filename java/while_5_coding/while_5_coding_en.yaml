statement: "Given a string variable `str`, complete the following code in order to determine whether the string `str` is a\
  \ palindrome. A palindrome is a string of characters that reads the same forward or backward. Store the result in a boolean\
  \ variable called `isPalindrome`.\nAssume that the initial value of variable `str` is already set to a string with at least\
  \ one character.\n\nHint: Start from the leftmost and rightmost characters of the string `str` and keep comparing characters\
  \ while they are same.  \n\nE.g. 1: if the initial value of `str` is \"aba\", the value of `isPalindrome` will be true .\
  \ \nE.g. 2: if the initial value of `str` is \"abc\", the value of `isPalindrome` will be false . \nE.g. 3: if the initial\
  \ value of `str` is \"abbccbba\", the value of `isPalindrome` will be true ."
