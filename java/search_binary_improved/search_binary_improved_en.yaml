statement: |-
  Complete the method `improvedBinarySearch` in order to search for a number within a sorted ArrayList of integers by implementing a binary search algorithm. However, you need to optimize the execution of the algorithm by avoiding running the binary search procedure at the beginning of the method if the number is out of the range of the sorted ArrayList, i.e., the number that is being looked for is lower than the lowest number in the list or greater than the greatest number in the list (this helps for saving some execution time).

  The method needs to return two integers arranged within an array of integers:
  - 1st element: the index of the searched element (-1 if it is not there)
  - 2nd element: how many comparisons were performed to find the number (initial comparisons done for checking if the number is out of the ArrayList should not be considered for this calculation)
