statement: |-
  Complete the following method which takes the following parameters (in this order):

  - an array of integers `arr`,
  - an integer `count`,
  - and an integer `key`,

  the method has to return the index where the integer `key` appears last in the array `arr` but ONLY considering the last `count` elements in the array as searchable. In case the integer `key` does not appear in the fixed range of the array, the method must return -1. For example:

  ```
  indOfLast( {1,2,3,4,5,6} , 4 , 3 ) => 2
  indOfLast( {1,2,4,4,5,7} , 6 , 4 ) => 3
  indOfLast( {3,2}, 1 , 3 ) => -1
  ```
