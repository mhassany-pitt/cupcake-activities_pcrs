statement: "Consider the following code:\n\n```\npublic class Circle {\n    private double radius;\n\n    public double getRadius()\
  \ {\n\t  return radius;\n    }\n}\n```\n\nWrite a method for the class `Circle` named `setRadius` that sets the `radius`\
  \ of the circle to the value that is specified as the parameter of the `setRadius` method. This method does not return anything.\
  \ Note that the radius of a circle must be always a positive number. Therefore, this method prevents setting the radius\
  \ of the circle to a negative value or zero."
