statement: "Complete the code for the class Sphere. Assume that the getter/setter methods are already implemented. You have\
  \ to implement the following methods (follow specifications as if they were written in UML class diagram):\n\n+ getArea():\
  \ double -> it calculates the area of the sphere (please use the constant PI defined in the class for this)\n+ getVolume():\
  \ double -> it calculates the volume of the sphere (please use the constant PI defined in the class for this)\n+ pointInSphere(xPoint:\
  \ int, yPoint:int, zPoint: int): boolean -> it checks if the points with given coordinates xPoint, yPoint and zPoint is\
  \ contained inside the sphere (**Hint**: get the Euclidean distance between the center of the sphere and the point and check\
  \ if it is greater than the sphere's radius or not. Using `sqrt` and `pow` methods from Math class could be helpful here.)\
  \ \n\nMore instructions on how to implement the missing parts of this class are provided in the code below."
