  Complete the following method which takes an array of ints as a parameter and returns the number of values in the array that are divisible by 3. For example:

  ```
  countDivisibleBy3( {1,2,3,4,5,6} ) => 2
  countDivisibleBy3( {1,2,4,4,5,7} ) => 0
  countDivisibleBy3( {3,4,5} ) => 1
  ```
