statement: "Complete the method `sortArray` in order to ascendingly sort the first `count` elements of an array of integers\
  \ (`arr`). `count` and `arr` are given as parameters of `sortArray` (in that order).\n\n**Instructions on how to solve this\
  \ problem:**\n\n-  Write a loop that goes from i=0 to i < count. \n-  For each value of i get the index of the smallest\
  \ number in the array starting at i. \n-  Swap the array element at i with the element as indOfMin. In order to avoid losing\
  \ any element while trying to swap pairs, you have to use an auxiliary temporal variable (for this, use the following lines\
  \ of code `temp = a; a=b; b = temp;` in the same order)."
