  location:
    snippet: "static int indOfMin( int[] arr, int count, int startingAt){\n    int minIndex = startingAt;\n    int min = arr[startingAt];\n\
      \    for(int i=startingAt+1;i<count;i++){\n        if(arr[i]<min){\n            minIndex = i;\n        }\n    }\n  \
      \  return minIndex;\n}\n    "
