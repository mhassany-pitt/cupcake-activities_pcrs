statement: |-
  You have a class called `Bank` that keeps track of how much money you have in your "Bank account". You are provided with the constructor and the accessors, but you need to write the setter methods for this class. Write a method called `addMoney` to add money to the "spending account" (this is your `spendings` variable), and another method that "transfers" all of your money from your spending account into your savings account (this is your `savings` variable).

  E.g. 1: If I had a `Bank` object called `myBank`, `myBank.addMoney(150.0)` should add $150 to my spending account
  E.g. 2: If I had a `Bank` object called `myBank`, `myBank.moveToSavings()` should transfer my original $150 from my spending account into my savings account and my spending account should be 0.

  Hint: Make sure both setter methods you write are `void` methods
  Hint: When transferring money from spending to savings, make sure you set spending back to 0.
