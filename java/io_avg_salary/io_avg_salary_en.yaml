statement: |-
  Please complete the following method `getAverageSalary` in order to calculate the salary of a set of workers of a global company, whose information is contained in a text file formated in the following way:

  `name1,country1,salary1
  name2,country2,salary2
  name3,country3,salary3
  ...
  namen,countryn,salaryn`

  The method receives a `BufferedReader` object as input, so you need to assume that the initialization of the `BufferedReader` object with a `FileReader` object was already done so you do not need to take care of it.

  Important: If the file is empty, please return 0.0 as the avg.

  Hint: you can use the method split() to separate each line in multiple fields.
