statement: |-
  Suppose that we have a class `Employee` and we want to extend it to produce class `Janitor`. The class `Employee` provides the following two methods:

  ```
  public double getSalary() { … }  //Returns the default salary of an employee
  public int getHours() { … } //Returns the default working hours of an employee
  ```

  Override the above methods in class `Janitor` assuming that janitors work twice as many hours per week as other employees and make $5000.0 less than general employees.

  Make sure to interact with the superclass.
