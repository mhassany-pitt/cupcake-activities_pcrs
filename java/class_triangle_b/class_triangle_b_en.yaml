statement: |-
  Complete the code for the class Triangle, which represents a right triangle. You have to implement all the accessor and mutator (getter/setter) methods for each of these 2 attributes:

  area is the Area of the triangle
  perimeter is the Perimeter of the triangle

  Sides a, b, and c are already defined for you in the Triangle's constructor.  You do not have to worry about implementing getter/setter methods for the sides.

  You have to implement the following methods (follow specifications as if they were written in UML class diagram):

  + getArea(): double -> Calculates the area of the triangle (ab/2)
  + getPerimeter(): double -> it calculates the perimeter of the triangle (simply the sum of all sides)

  Use the Math class to your advantage for this problem.

  More instructions on how to implement the missing parts of this class are provided in the code below.
