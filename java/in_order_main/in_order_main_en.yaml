statement: "Given three integer variables, `a`, `b`, and `c`, write a boolean expression to determine if `b` is greater than\
  \ `a`, and `c` is greater than `b`. However, with the exception that if the boolean variable `bOk` is true, `b` does not\
  \ need to be greater than `a`. Store the result of this expression in a variable called `result`. Assume that the initial\
  \ value of the variables `a`, `b`, and `c` is already set to an integer and the initial value of the variable `bOk` is already\
  \ set to a boolean value.\n\nE.g. 1: if the value of `a` is 1, the value of `b` is 2 , the value of `c` is 4, and the value\
  \ of `bOk` is false, the value of `result` will be true. \nE.g. 2: if the value of `a` is 1, the value of `b` is 2 , the\
  \ value of `c` is 1, and the value of `bOk` is false, the value of `result` will be false. \nE.g. 3: if the value of `a`\
  \ is 1, the value of `b` is 1 , the value of `c` is 2, and the value of `bOk` is true, the value of `result` will be true."
