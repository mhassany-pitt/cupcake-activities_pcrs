statement: |-
  Complete the method `sortArray` in order to ascendingly sort the first `count` elements of an array of integers (`arr`). `count` and `arr` are given as parameters of `sortArray` (in that order).

  **Instructions on how to solve this problem:**

  -  Inside the given for loop, you have to nest another loop (controlled by j) that will be responsible for moving the i-th largest element to its respective position in the right part of the array, one by one.
  -  For moving the i-th largest element in the array to the right side of the array on each i-th iteration, you have to repetitively swap contiguous elements (arr[j] and arr[j+1]) when needed (if arr[j] > arr[j+1]).
