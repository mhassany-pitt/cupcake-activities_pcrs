statement: "The number 6 is a truly great number. Given two integer variables, `a` and `b`, write a boolean expression to\
  \ determine if either one of these two integers is 6 or if their sum or difference is 6. Store the result of this expression\
  \ in a variable called `result`. Assume that the initial value of the variables `a` and `b` is already set to an integer.\
  \ \nNote: the method `Math.abs(num)` computes the absolute value of the number `num`.\n\nE.g. 1: if the value of `a` is\
  \ 6 and the value of `b` is 4,  the value of `result` will be true. \nE.g. 2: if the value of `a` is 4 and the value of\
  \ `b` is 5,  the value of `result` will be false."
