statement: "Suppose that we have a class `Book` and we want to extend it to produce class `Dictionary`. The class `Book` has\
  \ one data member, `pages`, that is an integer that represents the number of the pages in the book. A `Dictionary` has two\
  \ data members, `pages` (representing number of pages in the dictionary) and `definitions` (representing the number of definitions\
  \ in the dictionary). \n\nComplete the class `Dictionary` by adding the required data member, two constructors, and the\
  \ required getter method to return the data member of class `Dictionary`. \n\nThe `Dictionary` class should have constructors\
  \ that permit a dictionary to be created when:\n(1) the number of pages  and the number of definitions in the dictionary\
  \ are specified\n(2) none of the dictionary properties are specified. In this case, we create a dictionary with default\
  \ values, that is a dictionary with 200 pages and 10000 definitions."
