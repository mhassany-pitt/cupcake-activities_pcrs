statement: "Complete the following code for overloading the constructors of the class Grade. For this task, you need to consider\
  \ the following grade conversion table:\n\nLetter grade | Percent grade\nA+: 97-100\nA: 93-96\nA-: 90-92\nB+: 87-89\nB:\
  \ 83-86\nB-: 80-82\nC+: 77-79\nC: 73-76\nC-: 70-72\nF: Below 70\n\nConstructors definition:\n+ Grade(studentID: String)\
  \ -> this one will set the percentGrade as 0 and letterGrade as F\n+ Grade(studentID: String, percent: int) \n+ Grade(studentID:\
  \ String, letter: char, sign: char) -> this one will set letterGrade as the concatenation of `letter` and `sign`, and the\
  \ percent score as the upper limit of the corresponding range (e.g. if `letter` score is B+, `percent` will be equals to\
  \ 89). If second parameter is ' ' (whitespace), do not concatenate (keep the single letter given as first parameter as it\
  \ is).\n\nImportant: assume that grades provided will always be within the specified range (`percentScore` from 0 to 100),\
  \  that `letterGrade` with first character always from 'A' to 'F' and the second character always '+', '-' or ' ' - the\
  \ last one represents when the letter grade has no sign associated).\n\nMore instructions on how to implement the missing\
  \ parts of this class are provided in the code below."
