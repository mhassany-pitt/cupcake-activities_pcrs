statement: |-
  Complete the following method which takes the following parameters (in this order):

  - an array of integers `arr`,
  - an integer `count`,
  - an integer `startingAt`,
  - and an integer `key`,

  the method has to return the index where the integer `key` appears for the first time starting to count from position `startingAt` and considering only the `count` next elements in the array. In case the integer `key` does not appear in the fixed range of the array, the method must return -1. For example:

  ```
  indOfFirst( {1,2,3,4,5,6} , 2 , 3 , 3 ) => -1
  indOfFirst( {1,2,4,3,5,7} , 2 , 3 , 3 ) => 3
  indOfFirst( {3,2}, 1 , 0 , 3 ) => 0
  ```
