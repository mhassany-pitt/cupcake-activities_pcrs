statement: |-
  Complete the following method which takes an array of ints as a parameter and returns true if the array contains the same number of positive and negative values. Remember that zero is neither positive nor negative. For example:

  ```
  sameNumPosNeg(new int[] {1,0,-1}) => true
  sameNumPosNeg(new int[] {1,0,-1,-1}) => false
  sameNumPosNeg(new int[] {1,0,0}) => false
  sameNumPosNeg(new int[] {1,0,0,1,-2,-99}) => true
  ```
