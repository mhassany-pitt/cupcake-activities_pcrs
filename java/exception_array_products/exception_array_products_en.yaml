statement: |-
  Complete the method getProductPrice(Product[] arr, int index) in order to get the price of the product in the position `index` of the array `arr`. You need to be aware of two erroneous situations that could happen in this context, where you need to implement try/catch to handle this situations:

  1. If the product in the position `index` is `null`, the method needs to return 0.0;
  2. If the `index` provided is "out of bounds" of the array `arr`, the method needs to return -9999.0;
