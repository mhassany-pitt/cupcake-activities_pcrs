statement: |-
  Assume that we have a class called `Calculator` that provides a method for performing the average operation. Complete the following `Calculator` class by writing a method called `average` that accepts two integer parameters and returns their average as a double.

  E.g. 1: if the first parameter of the `average` method is 3 and the second parameter of the `average` method is 6, the value returned by the `average` method will be 4.5.
  E.g. 2: if the first parameter of the `average` method is 10 and the second parameter of the `average` method is 2, the value returned by the `average` method will be 6.0.
