statement: "The squirrels in Palo Alto spend most of the day playing. In particular, they play if the temperature is between\
  \ 60 and 90 (inclusive). Unless it is summer, then the upper limit is 100 instead of 90. Given an integer variable `temp`\
  \ and a boolean variable `isSummer`, write a boolean expression to determine if the squirrels play. Store the result of\
  \ this expression in a variable called `result`. Assume that the initial value of the variables `temp` and `isSummer` is\
  \ already set to an integer and a boolean value, respectively.\n\nE.g. 1: if the value of `temp` is 70 and the value of\
  \ `isSummer` is false,  the value of `result` will be true. \nE.g. 2: if the value of `temp` is 95 and the value of `isSummer`\
  \ is false,  the value of `result` will be false."
