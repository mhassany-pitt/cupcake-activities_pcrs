statement: "By using the LinkedList class implemented in the java.lang package, complete the method `listRepeated` in order\
  \ to return a LinkedList that includes only the elements that appear in BOTH listA and listB. The elements in the returned\
  \ LinkedList must follow the number of appearances and the order of appearance specified in listA.\n\nE.g. \nlistA = [3,4,5,6],\
  \ listB = [6,6,7,3,8], then returned newList = [3,6] (here we include 6 only once because in listA it only appears once)\n\
  listA = [3,4,4,5,6,7], listB = [34,7,12], then returned newList = [7]\nlistA = [4,90,1,2], listB=[3,67,0,55,12], then returned\
  \ newList = [] (empty LinkedList, no elements)"
