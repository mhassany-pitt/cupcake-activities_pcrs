statement: |-
  Given an array of ints and two ints, count the total number of times
  each int occurs in the array. If the two int parameters are the same,
  you should only count them once.
  For example:

  ```
  numTimes2({1,2,3,4,2,1}, 1, 2) => 4
  numTimes2({1,2,3,4,5,4,3,2,1}, 7, 4) => 2
  numTimes2({5,6,7,4,2,4,5,2,6,7,3,4,2}, 2, 2) => 3
  ```
