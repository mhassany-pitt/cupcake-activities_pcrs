statement: "Complete the following code in order to calculate the height of a person in feet, given that his/her height is\
  \ `heightInInches` inches. Assume that the initial value of variable `heightInInches` is already set to a positive integer.\n\
  \nYou need to convert the given `heightInInches` to feet. \nFor example, 12 inches is 1 foot. \n\nDefine a variable called\
  \ `heightInFeet` and set the height in feet value to this variable. \n\nE.g. 1: If the value of `heightInInches` is 78,\
  \ the code prints \"Height in feet: 6.5\" (without the quotations). Please pay attention to the white spaces!\nE.g. 2: If\
  \ the value of `heightInInches` is 84, the code prints \"Height in feet: 7.0\" (without the quotations). Please pay attention\
  \ to the white spaces!"
