statement: |-
  Complete the following program in order to print to the console the first 6 characters of a string entered by a user from the keyboard. Assume that the string entered by the user is at least 6-character long.

  **Important:** Note that you have to define a variable named `firstSixChars` to store the 6 first characters of the user input, which are printed to the console in the last part of the code below.
elements:
- type: locked
  location:
    snippet: "import java.util.Scanner;\n\npublic class Lab2 {\n    public static void main(String[] args){\n        // Create\
      \ a scanner to read from keyboard\n        Scanner kbd = new Scanner (System.in);\n        \n        // Prompt user\
      \ for typing text input\n        System.out.print(\"Enter any string ( e.g your name): \");\n        //Store user input\
      \ in a String variable\n        String s = kbd.nextLine();\n        System.out.println(\"You entered \" + s);\n    \
      \    \n        //YOU MUST NOT WRITE ANY CODE ABOVE THIS LINE"
- type: editable
  location:
    snippet: "        \n        // Define variable firstSixChars to store the first 6 characters of the user input\n     \
      \   \n             \n        "
  placeholder: "        \n        // Define variable firstSixChars to store the first 6 characters of the user input\n   \
    \     \n             \n        "
- type: locked
  location:
    snippet: "        //YOU MUST NOT WRITE ANY CODE BELOW THIS LINE\n        \n        //Prints to the console the 6 first\
      \ characters of the user input\n        System.out.println(\"First 6 characters: \"+firstSixChars);\n  }\n}"
