statement: "Given a number `n`, complete the following code in order to determine the value of variable `result`. The value\
  \ of variable `result` is true if `n` is in the range 1..10, inclusive. Unless `outsideMode` is true, in which case `result`\
  \ is true if the number is less or equal to 1, or greater or equal to 10. \nAssume that the initial value of the variables\
  \ `n` and `outsideMode` is already set to an integer and a boolean value, respectively.\n\nE.g. 1: if the value of `n` is\
  \ 5 and the value of `outsideMode` is false, the value of `result` will be true.\nE.g. 2: if the value of `n` is 11 and\
  \ the value of `outsideMode` is false, the value of `result` will be false.\nE.g. 3: if the value of `n` is 11 and the value\
  \ of `outsideMode` is true, the value of `result` will be true."
