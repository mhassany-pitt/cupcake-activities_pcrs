statement: "Given 3 integers, `a`, `b`, and `c`, write a boolean expression to determine if it is possible to add two of the\
  \ integers to get the third. Store the result in a boolean variable called `result`. The variable `result` is true if it\
  \ is possible to add two of the integers to get the third,  and false otherwise. \n\nAssume that the initial value of the\
  \ variables `a`, `b`, and `c` is already set to an integer.\n\nE.g. 1: if the value of `a` is 1, the value of `b` is 2,\
  \ and the value of `c` is 3, the value of `result` will be true.\nE.g. 2: if the value of `a` is 3, the value of `b` is\
  \ 1, and the value of `c` is 2, the value of `result` will be true.\nE.g. 3: if the value of `a` is 3, the value of `b`\
  \ is 2, and the value of `c` is 2, the value of `result` will be false."
