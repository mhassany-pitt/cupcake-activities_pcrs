statement: "Complete the following code in order to prompt the user for his/her full name (first name, middle name and last\
  \ name separately) and then for his/her height in inches, then the code has to convert and display the height in inches\
  \ to feet, then ft'' in', then meters.\n\nFor the conversions, please consider that 12 inches is 1 foot. Also, use the conversion\
  \ rate 0.0254 as your inches to meters conversion rate. For example, 1 inch is 0.0254 meters.\n\nTry to solve this problem\
  \ by defining constant values (use keyword **final**) that will store the conversion rate specified above. Then, use these\
  \ constant values in your calculations. \n(This is not a requirement but something that will make the code readability better)\
  \ \n\nNote: The java.util.Scanner is already imported. In your submission, you do not have to import it again. If you import\
  \ again, you will get an error in your submissions. \n\nE.g. \n**For the input:**\nFirst name: William\nMiddle name: Jefferson\n\
  Last name: Clinton\nHeight (in inches): 75\n\n**For the output:**\nFull Name: Clinton, William Jefferson\nHeight in inches:\
  \ 75\nHeight in feet & inches: 6 ft. 3 in.\nHeight in feet:  6.0833 \nHeight in meters:  1.854139"
