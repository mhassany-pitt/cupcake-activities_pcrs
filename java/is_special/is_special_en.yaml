statement: "Given an integer variable, `n`, write a boolean expression to determine if this integer is a special number. We'll\
  \ say a number is special if it is a multiple of 11 or if it is one more than a multiple of 11. Store the result of this\
  \ expression in a variable called `result`. Assume that the initial value of the variable `n` is already set to a non-negative\
  \ integer. \n\nE.g. 1: if the value of `n` is 22,  the value of `result` will be true. \nE.g. 2: if the value of `n` is\
  \ 23,  the value of `result` will be true. \nE.g. 3: if the value of `n` is 24,  the value of `result` will be false."
