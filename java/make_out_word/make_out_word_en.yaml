statement: |-
  Given two string variables `out` and `word`, complete the following code in order to create a new string where the string `word` is in the middle of the string `out`. Store the resulting string in a variable called `str`.  Assume that the initial value of variables `out` and `word` is already set to a string and variable `out` has exactly 4 characters.

  E.g. 1: if the value of `out` is "(())" and the value of `word` is "Yay", the code prints ((Yay)).
  E.g. 2: if the value of `out` is "----" and the value of `word` is "WooHoo", the code prints --WooHoo--.
  E.g. 3: if the value of `out` is "[[]]" and the value of `word` is "word", the code prints [[word]].
