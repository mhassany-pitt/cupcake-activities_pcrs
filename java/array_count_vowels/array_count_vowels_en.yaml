statement: |-
  In the English language, a letter representing a vowel sound includes a, e, I, o, u.

  Write a method called countVowels that takes an array of characters as a parameter and returns the number of times that a lowercase vowel occurs (i.e. an 'a', 'e', 'i', 'o', or 'u').

  countVowel({'i','c','e','c','r','e','a','m'}) -> 4

  countVowel{'t','o','w','e','l'}) -> 2

  countVowel({'r','y','t','h','m'}) -> 0
