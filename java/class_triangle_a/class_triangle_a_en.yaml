statement: |-
  Complete the code for the class Triangle, which represents a right triangle. You have to implement all the accessor and mutator (getter/setter) methods for each of these 3 attributes:

  a is Side A of the triangle (also the height)
  b is Side B of the triangle (also the base)
  c is Side C of the triangle (also the hypotenuse)

  **Important:** the getter for setting the value of the hypotenuse (`getC`) needs to receive two input parameters (not directly the value), the height and the base (i.e., a and b), and calculate the value of c based on that (you need to use Pythagorean theorem here).

  You must ensure all sides of the triangle are positive.

  Use the Math class to your advantage for this problem.

  More instructions on how to implement the missing parts of this class are provided in the code below.
elements:
- type: locked
  location:
    snippet: "import java.lang.*;\npublic class Triangle{ \n    //class attributes\n    private int a;\n    private int b;\n\
      \    private double c;\n    \n    private double perimeter;\n    private double area;\n    \n    public Triangle(){\n\
      \        a=3;\n        b=4;\n    }\n    "
- type: editable
  location:
    snippet: "    // TO DO: Add getter/setter methods for all of the properties of this \n    // class:\n    // (setA, getA,\
