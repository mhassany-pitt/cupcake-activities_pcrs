statement: |-
  Complete the code for the class Sphere. You have to implement all the accessor and mutator (getter/setter) methods for each of these 4 attributes:

  x is the x-coordinate of the sphere center
  y is the y-coordinate of the sphere center
  z is the z-coordinate of the sphere center
  radius is the sphere's radius (make sure that its setter/mutator only allows positive numbers for the sphere radius)

  You also have to implement the following methods (follow specifications as if they were written in UML class diagram):

  + getArea(): double -> it calculates the area of the sphere (please use the constant PI defined in the class for this)
  + getVolume(): double -> it calculates the volume of the sphere (please use the constant PI defined in the class for this)
  + pointInSphere(xPoint: int, yPoint:int, zPoint: int): boolean -> it checks if the points with given coordinates xPoint, yPoint and zPoint is contained inside the sphere

  More instructions on how to implement the missing parts of this class are provided in the code below.
