statement: "Complete the following code in order to calculate the height of a person in meters, given that his/her height\
  \ is `heightInInches` inches. Assume that the initial value of variable `heightInInches` is already set to a positive integer.\n\
  \nYou need to convert the given `heightInInches` to meters. \nUse the conversion rate 0.0254 as your inches to meters conversion\
  \ rate. For example, 1 inch is 0.0254 meters. \n\nDefine a variable called `heightInMeters` and set the height in meters\
  \ value to this variable. \n\nTry to solve this problem by defining constant values (use keyword **final**) that will store\
  \ the conversion rate specified above. Then, use these constant values in your calculations. \n(This is not a requirement\
  \ but something that will make the code readability better) \n\nE.g. 1: If the value of `heightInInches` is 63, the code\
  \ prints \"Height in meters: 1.6002\" (without the quotations). Please pay attention to the white spaces!\nE.g. 2: If the\
  \ value of `heightInInches` is 75, the code prints \"Height in meters: 1.905\" (without the quotations). Please pay attention\
  \ to the white spaces!"
