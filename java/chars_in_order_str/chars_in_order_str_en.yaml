statement: |-
  Given a String as a parameter, return true only when
  the letters of the String are in alphabetical order. Assume
  that the empty String is in alphabetical order.
  For example:

  isAlpha("abc") => true
  isAlpha("xya") => false
  isAlpha("w") => true
