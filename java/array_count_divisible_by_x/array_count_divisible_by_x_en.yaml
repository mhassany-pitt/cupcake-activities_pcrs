statement: |-
  Write a function (static method) that takes an array of ints
  and an int named `x` as parameters, and returns
  the number of values in the array that are divisible by x.
  For example:

  ```
  countDivisibleByX( {1,2,3,4,5,6}, 2) => 3
  countDivisibleByX( {1,2,3,4,5,6}, 1) => 6
  countDivisibleByX( {1,2,3,4,5,6}, 7) => 0
  ```
