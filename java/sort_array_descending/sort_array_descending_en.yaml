statement: |-
  Complete the method `sortArray` in order to descendingly sort the elements of an array of integers (`arr`). `arr` is given as parameters of `sortArrayDesc`.

  **Instructions on how to solve this problem:**

  -  Inside the given for loop, you have to nest another loop (controlled by j) that will be responsible for moving the i-th smallest element to its respective position in the right part of the array, one by one.
  -  For moving the i-th smallest element in the array to the right side of the array on each i-th iteration, you have to repetitively swap contiguous elements (arr[j] and arr[j+1]) when needed.
  - If after a j-th iteration you realize that all the elements are in order, you can stop the execution of the sorting algorithm.
