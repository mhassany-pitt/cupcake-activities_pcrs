statement: "Write a program that increments an integer input, n, to m, but breaks away if the increment ever becomes a multiple\
  \ of 7.  Assume an integer named `n` is already defined for you and use that to increment.  Additionally, assume an integer\
  \ `m` is already defined for you, which will act as your limit to increment towards (note: you should be able to increment\
  \ up to m, but not past it).  \n\nStore the number of times that you loop through into an integer variable called `count`,\
  \ which is also already defined, but not initialized.\nExamples:\n- If n = 8 and m = 20, the total number of loops will\
  \ be 6 (since we encounter 14 along the way).\n- If n = -6 and m = 12, the total number of loops will be 14 (since we encounter\
  \ 7 along the way).\n- If n = 9 and m = 10, the total number of loops will be 1 (since we get to m without encountering\
  \ any multiples of 7).\n\nNote that 0 should not be a valid multiple of 7 at any point in your iterations."
