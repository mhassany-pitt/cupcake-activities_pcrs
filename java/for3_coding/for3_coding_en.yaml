statement: |-
  Dada una variable de cadena `cadena`, completa el siguiente código para crear un texto en el que cada carácter de `cadena` aparezca repetido dos veces. El texto resultante se guarda en una variable llamada `resultado`. Supón que el valor inicial de la variable `cadena` ya está fijado en un texto con al menos un carácter.

  Ej. 1: si el valor de `cadena` es "The", el código imprime TThhee.
  Ej. 2: si el valor de `cadena` es "AAbb", el código imprime AAAAbbbb.
  Ej. 3: si el valor de `cadena` es "Hi-There", el código imprime HHii--TThheerree.
