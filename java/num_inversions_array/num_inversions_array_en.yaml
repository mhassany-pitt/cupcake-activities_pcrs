statement: |-
  Write a program that given an array of integers variable called `array` prints in the console the **the number of inversions** happening in the array. An inversion occurs every time two neighboring elements are out of sorted order. For example, is array[3]=5 and array[4]=1 then those two elements are not in sorted order, because a smaller number comes after a larger number, this is called an inversion.

  Please note that you have to complete the method `numOfInversions(int [] input)`.
