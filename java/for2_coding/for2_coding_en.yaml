statement: |-
  Given an integer variable `n`, complete the following code in order to calculate the factorial of the integer `n`. The factorial n! is calculated using the formula 1*2*3*...*n. For example 4! = 1*2*3*4 = 24. Additionally, it is defined that 0! = 1.

  The result is stored in a long variable called `factorial`. Assume that the initial value of the variable `n` is already set to an integer greater than or equal to zero.

  E.g. 1: if the value of `n` is 3, the value of `factorial` will be 6.
  E.g. 2: if the value of `n` is 4, the value of `factorial` will be 24.
  E.g. 3: if the value of `n` is 5, the value of `factorial` will be 120.
