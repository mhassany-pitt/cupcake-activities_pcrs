statement: "*Using recursion*,\n    complete the `doubleCharacters` method\n    so that it returns a string in which the characters\
  \ of\n    the parameter string are doubled.\n    Examples:\n\n - `doubleCharacters(\"\")` => `\"\"`\n\n - `doubleCharacters(\"\
  a\")` => `\"aa\"`\n\n - `doubleCharacters(\"abc\")` => `\"aabbcc\"`\n\n - `doubleCharacters(\"Hello\")` => `\"HHeelllloo\"\
  `\n\n    Hints:\n\n - The `substring` method can be used to get a string\n        containing the characters of the original\
  \ string from a\n        start index (inclusive) to an end index (exclusive).\n        For example, `s.substring(1, s.length())`\n\
  \        returns a substring containing all of the characters\n        of `s` except for the first.\n \n\n - \n        The\
  \ `charAt` method can be used to return the\n        character at a specified index in a string.\n        For example, `s.charAt(0)`\
  \ returns the first\n        character of `s`.\n \n\n - \n        Make sure that your recursive call(s) make progress\n\
  \        towards a base case.\n \n\n - \n        You can use string concatenation to construct the result\n        string.\
  \  For example, if `c` is a `char`\n        variable, then\n \"\" + c + c\n        is a string that contains two repetitions\
  \ of the\n        character that `c` contains."
