statement: |-
  Suppose that we have a class `Employee` and we want to extend it to produce class `OvertimeEmployee`. The class `Employee` provides the following three methods:

  ```
  public double getHourlyRate() { … }  //Returns the default hourlyRate of an employee
  public int getHours() { … } //Returns how many hours a worker has worked
  public double getSalary() { ... }//Returns the salary for a worker (multiplication between hours and hourlyRate
  ```

  Implement the `getSalary()` method in the `Employee` class and override it in class `OvertimeEmployee` assuming that the salary of an overtime employee is the same as a regular employee but multiplied by the `overtimeFactor`

  Make sure to interact with the superclass.
