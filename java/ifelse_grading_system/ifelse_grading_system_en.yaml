statement: "You will be coding a function that will take in an input of a percentage and will output the letter grade and\
  \ the GPA equivalent.\n\nIn this learning activity, you will be tested on your knowledge of if-else statements and how to\
  \ implement it. You will be modifying 2 variables: double gpa (which houses your gpa equivalent in decimal form), and String\
  \ letter (which houses your letter grade equivalent in String form)\n\nNote: Make sure you do not have any spaces in your\
  \ String letter variable and that your double variable always only holds 2 digits or less after the decimal point.\n\nBelow\
  \ is the chart for the range of each letter grade/GPA: \nAssume your input will always be an int value and within the range\
  \ [0, 100]\n\n     A+  |    4.0     |     97% ≤ `percentage` ≤ 100%\n     A    |    4.0     |     93% ≤ `percentage` < 97%\n\
  \     A-   |   3.75   |     90% ≤ `percentage` < 93%\n     B+  |   3.25   |     87% ≤ `percentage` < 90%\n     B    |  \
  \  3.0    |     83% ≤ `percentage` < 87%\n     B-   |  2.75    |     80% ≤ `percentage` < 83%\n     C+  |  2.25    |   \
  \  77% ≤ `percentage` < 80%\n     C    |   2.0     |     73% ≤ `percentage` < 77%\n     C-   |  1.75    |     70% ≤ `percentage`\
  \ < 73%\n     D+  |  1.25    |     67% ≤ `percentage` < 70%\n     D    |   1.0     |     63% ≤ `percentage` < 67%\n    \
  \ D-   |  0.75    |     60% ≤ `percentage` < 63%\n     F     |   0.0     |     0% ≤ `percentage` < 60%\n\nNote: YOU DO NOT\
  \ HAVE TO HAVE A SYSTEM.OUT.PRINTLN IN YOUR CODE. AS LONG AS YOU MODIFY THE 2 VARIABLES GIVEN, YOU WILL SUCCEED.\n\nExamples\
  \ of input/output:\n\nE.g. Enter percentage received in class: 96 | Output in console: \"Letter Grade Received: A : GPA\
  \ Received: 4.0\"\nE.g. Enter percentage received in class: 88 | Output in console: \"Letter Grade Received: B+ : GPA Received:\
  \ 3.25\"\nE.g. Enter percentage received in class: 85 | Output in console: \"Letter Grade Received: B : GPA Received: 3.0\"\
  \nE.g. Enter percentage received in class: 60 | Output in console: \"Letter Grade Received: D- : GPA Received: 0.75\"\n\
  E.g. Enter percentage received in class: 59 | Output in console: \"Letter Grade Received: F : GPA Received: 0.0\""
