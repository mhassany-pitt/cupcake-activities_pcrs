statement: |-
  Write a program that simulates password creation, where you collect the user's input for their password and validate whether or not that password is valid, according to certain conditions. If the user's input password does not satisfy the conditions, continue to ask for a password until it does.  You should also include a count to keep track of the total number of attempts the user makes to match the correct formatting (i.e., the number of times we loop through the prompt).

  The conditions are as follows:
  - The password is at least 5 characters, but no more than 15 characters.
  - The password must contain at least one uppercase letter.

  Try to solve this problem using a do-while loop.
