statement: "Given two integer variables `rows` and `stars`, write a **nested for loop** to print an output made of asterisks\
  \ (* symbols). The number of lines in the output is equal to the value of `rows` and the number of asterisks in each line\
  \ of the output is equal to the value of `stars`.\n\nAssume that the initial value of variables `rows` and `stars` is already\
  \ set to a non-negative integer.   \n\nE.g.1: if the value of `rows` is 2 and the value of `stars` is 1, the code prints\
  \ the following output:\n *\n *\n\nE.g.2: if the value of `rows` is 3 and the value of `stars` is 2, the code prints the\
  \ following output:\n**\n**\n**"
