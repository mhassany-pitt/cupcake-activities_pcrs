statement: |-
  Complete the following code to swap the characters between 2 strings entered by the user (`str1` and `str2` respectively), but only the ones positioned in even indexes (e.g. 0, 2, etc.). Characters in odd positions must remain the same. In case one of the strings is longer than the another one, after performing all the possible swaps, the remaining characters in the longer string have to be replaced by the character '#'.

  Assume that both strings (`str1` and `str2`) will have at least 1 character each (the empty string will not be used as input here).

  The new strings derived from the swapping procedure must be printed in console, one of them in a different line.

  E.g.
  **Input:**
  Enter the 1st string: "apple"
  Enter the 2nd string: "orange"

  **Output:**
  opalg
  arpne#
