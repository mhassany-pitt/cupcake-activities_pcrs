statement: "Assume that we have a class called `Box` that contains instance data that represents the `height`, `width`, and\
  \ `depth` of the box.  The Box constructor accepts and initializes the `height`, `width`, and `depth` of the box. Complete\
  \ the following `Box` class by writing a `toString` method that returns a one-line description of the box. \n\nE.g. 1: if\
  \ the `height` is 1, `width` is 3, and `depth` is 5, the `toString` method returns \"[1.0,3.0,5.0]\".\n\nE.g. 2: if the\
  \ `height` is 4.4, `width` is 5.4, and `depth` is 1.2, the `toString` method returns \"[4.4,5.4,1.2]\"."
