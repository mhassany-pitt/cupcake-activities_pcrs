statement: |-
  Complete the code for the class Plane. The variable `mileage` refers to the accumulated number of miles that a plane has traveled and the variable `hoursFlight` refers to the accumulated number of hours that a plane has traveled.
  Here is the definition of the four variants of the method fly (`speed` of the plane is given in mph), written in UML notation:

  + fly(hours: float)
  + fly(miles: double)
  + fly(hours: flight, speed: int)
  + fly(miles: double, speed: int)

  Whenever a flight is taken by executing the method fly in any of its four variants, the `mileage` and the `flightHours ` need to be updated accordingly. When `speed` is not provided in the method fly, you need to use the constant `AVG_SPEED`. If the provided `speed` is greater that the `MAX_SPEED`, you need to use `MAX_SPEED`.

  You also need to complete the getters/setters for `mileage` and `flightHours` (Note: no negative or zero `mileage`,`flightHours` or `speed` are allowed, if that happens, current values of `mileage` and `flightHours` must be kept the same)

  More instructions on how to implement the missing parts of this class are provided in the code below.
