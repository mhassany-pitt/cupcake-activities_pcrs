statement: |-
  Complete the following method which takes an array of ints as a parameter and returns true if the array is in sorted ascending order, and false otherwise. For example:

  ```
  isSorted({1,2,3,100}) => true
  isSorted({1,2,3,0}) => false
  isSorted({4,5,2,7}) => false
  isSorted({}) => true
  ```
