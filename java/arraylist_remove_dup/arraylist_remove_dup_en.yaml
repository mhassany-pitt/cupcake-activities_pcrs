statement: |-
  Create a method that traverses through an input array and deletes all duplicate elements. Assume that the input ArrayList is already in numerical order. The method will be returning the new ArrayList with no duplicates in it
  For example:

  ```
  noDups([1, 1, 2, 3, 3, 3]) → [1, 2, 3]
  noDups([-3, -3, 3, 3]) → [-3, 3]
  noDups([-1, 2, 9]) → [-1, 2, 9]
  ```
