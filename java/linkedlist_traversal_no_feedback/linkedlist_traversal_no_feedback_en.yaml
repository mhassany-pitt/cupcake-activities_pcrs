statement: "Complete the method `traverseList` in order to return a String that includes all elements of the LinkedList. The\
  \ contents in the returned String must follow the order of appearance specified in the LinkedList. \n\nThe structure of\
  \ the custom LinkedList class has been included for you to view and understand its methods. You can assume this class represents\
  \ a LinkedList of type String. \n\nNote that the String you return should not include any additional characters (i.e., no\
  \ commas, spaces, etc. separating the elements).  Simply create an empty String and concatenate elements to that String\
  \ as you iterate through the nodes of the LinkedList.\n\nE.g. \nIf myList = [\"3\",\"4\",\"5\",\"6\"], then returned myString\
  \ = \"3456\"\nIf myList = [\"Hello\",\"World\",\"How\",\"Are\",\"You\"], then returned newString = \"HelloWorldHowAreYou\"\
  \nIf myList = [\"\"], then returned newString = \"\""
