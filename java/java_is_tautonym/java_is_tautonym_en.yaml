statement: |-
  Complete the following code in order to determine if a word if a given word can be considered as a "tautonym". A tautonym is a word that is formed by the repetition of a subword, e.g. tartar (tar and tar). Thus, its first half is exactly the same as the second half (so a word with an odd number of characters cannot be tautonym). The empty word is not considered as a tautonym.

  Assume that the word to be analyzed is stored in a String variable called `word`, which has already been initialized. Use the boolean variable `isTautonym` and define a boolean expression to decide if `word` is a tautonym.
