statement: |-
  Complete the code for the class Truck. You have to implement all the mutator/setter methods for each of these 5 attributes. Assume that the accessor/getter methods are already implemented.

  Make sure that `currentLoad` will never exceed `maxCapacity`. If it does, set `currentLoad` to maxCapacity. Also, make sure that the `maxCapacity` and `currentLoad` cannot be set as negative, it that happens set the value to 0.

  More instructions on how to implement the missing parts of this class are provided in the code below.
