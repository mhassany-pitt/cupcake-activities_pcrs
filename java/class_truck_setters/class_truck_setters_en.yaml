- type: locked
  location:
    snippet: "public class Truck { \n    private String model;\n    private int year;\n    private String color;\n \tprivate\
      \ double maxCapacity;\n    //If currentLoad is 0.0 the truck is empty, if equals to maxCapacity the truck is full\n\
      \    private double currentLoad;\n    \n    public Truck(){\n        this.model = \"default model\";\n        this.year\
      \ = 2000;\n        this.color= \"default color\";\n        this.maxCapacity = 1800.0;\n        this.currentLoad = 0.0;\
      \     \n    }\n    \n    public Truck(String truckModel, int truckYear, String truckColor, double truckMaxCapacity,\
      \ double truckCurrentLoad){\n    \tmodel = truckModel;\n        year = truckYear;\n        color = truckColor;\n   \
      \     maxCapacity = truckMaxCapacity;\n        currentLoad = truckCurrentLoad;   \n    }"
