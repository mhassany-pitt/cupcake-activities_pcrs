statement: |-
  Dada una variable de cadena `cadena`, completa el siguiente código para crear un texto que tenga el último carácter de `cadena` repetido 2 veces. Guarda el resultado en una variable llamada `resultado`.
  Supón que el valor inicial de la variable `cadena` ya está fijado en un texto con cero o más caracteres.

  Ej. 1: si el valor de `cadena` es "Hello", el código imprime oo.
  Ej. 2: si el valor de `cadena` es "HiH", el código imprime HH.
