statement: |-
  Write a function (static method) that takes two int arraylists
  as parameters, and returns true if they both have the same
  number of even values, and false otherwise. For example:

  ```
  sameNumEvens( {1,2,3}, {4,5,6} ) => false
  sameNumEvens( {1,2,3}, {5,6,7} ) => true
  sameNumEvens( {-2,2,18,36}, {1,2,3,4,5,6,7,8} ) => true
  ```
