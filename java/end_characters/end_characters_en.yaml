statement: |-
  Given two string variables `str1` and `str2`, complete the following code in order to check whether the string `str1` has the suffix specificed in string `str2`.  Assign the result to a Boolean variable `b`. Assume that the initial value of variables `str1` and `str2` is already set to a string, variable `str1` has a string with at least three characters, and variable `str2` has a string with exactly 3 characters.

  E.g. 1: if the value of `str1` is "Hello" and the value of `str2` is "llo", the code prints true.
  E.g. 2: if the value of `str1` is "234$" and the value of `str2` is "35$", the code prints false.
