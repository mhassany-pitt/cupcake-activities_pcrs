statement: "Given the class LinkedListExample, complete its method `mergeLists` that takes in a LinkedListExample objects\
  \ and returns a single LinkedListExample object that combines the LinkedListExample object that called the mergeLists method\
  \ with the method's input parameter.\n\nFor example, `mergeLists` should return a list that combines these two LinkedListExample\
  \ objects --\n\n`LinkedListExample list1: [\"hello\", \"there\"]`\n`LinkedListExample list2: [\"General\", \"Kenobi\"]`\n\
  \n-- as follows: \n\n`list1.mergeLists(list2);`\n`LinkedListExample returnedList: [\"hello\", \"there\", \"General\", \"\
  Kenobi\"]`"
