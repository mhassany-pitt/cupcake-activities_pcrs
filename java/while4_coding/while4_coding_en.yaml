statement: "Assume that you want to invest your money by putting it in a bank account that earns a certain percent interest\
  \ per year. Assume that your initial balance is stored in a double variable `balance` and the interest rate is stored in\
  \ a double variable `rate`. Given these two variables, complete the following code in order to calculate how many years\
  \ does it take for the initial balance to triple. Store the result in an integer variable called `year`. \n\nAssume that\
  \ the initial value of variables `balance` and `rate` is already set to a positive number and value of `rate` is in percent\
  \ (i.e. ranges from 0 to 100).\n\nNote that while this can be computed directly mathematically, you need to use a \"while\
  \ loop\" to figure out the answer for this exercise.\n\nE.g. 1:  if the value of `balance` is 1000 and the value of `rate`\
  \ is 5, the value of `year` will be 23.\nE.g. 2:  if the value of `balance` is 1000 and the value of `rate` is 10, the value\
  \ of `year` will be 12.\nE.g. 3:  if the value of `balance` is 1000 and the value of `rate` is 20, the value of `year` will\
  \ be 7."
