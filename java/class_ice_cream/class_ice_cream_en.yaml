statement: |-
  Complete the code for the class `IceCream`. You have to implement all the accessor and mutator (getter/setter) methods for each of these 2 attributes, as well as its constructor:

  - `sprinkles` is a boolean that specifies whether or not that `IceCream` object has sprinkles
  - `scoops` is an integer that specifies the number of scoops that `IceCream`object has
  - The constructor should default to no sprinkles and a single scoop when an `IceCream`object is initialized!

  Don't worry about returning or printing anything outside of your setters/getters -- this will happen behind the scenes and check whether your code is correct! Some tests will give feedback if your code is incorrect.
