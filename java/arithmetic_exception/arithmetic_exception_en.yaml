statement: |-
  Complete the method `avgHairballsPerCat(int numHairballs, int numCats)` in order to get the average number of hairballs that each cat spits up (you need to use **integer division here**, as 1.7 hairballs do not make much sense, right?). You'll need to handle an erroneous situation where there are no cats. (Hint: if there are no cats, what happens to your average calculation?)

  Implement try/catch to handle this situation:

  1. If the number of cats specified in the parameter `numCats` is `0`, the method needs to catch an arithmetic error and return 0.
