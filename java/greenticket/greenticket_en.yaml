statement: |-
  Tienes un boleto de lotería verde con los enteros `a`, `b` y `c` impresos. Completa el siguiente código para determinar el valor de la variable `resultado` según los tres enteros del boleto. Si los tres enteros son distintos entre sí, `resultado` es 0. Si los tres son iguales, `resultado` es 20. Si dos de los enteros son iguales, `resultado` es 10.
  Supón que el valor inicial de las variables `a`, `b` y `c` ya está fijado en un entero.

  Ej. 1: si el valor de `a` es 1, el de `b` es 2 y el de `c` es 3, el valor de `resultado` será 0.
  Ej. 2: si el valor de `a` es 2, el de `b` es 2 y el de `c` es 2, el valor de `resultado` será 20.
  Ej. 3: si el valor de `a` es 1, el de `b` es 1 y el de `c` es 2, el valor de `resultado` será 10.
