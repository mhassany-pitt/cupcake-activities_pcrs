statement: "Complete the `isPalindrome` method so that it returns\n `true` if the string passed as the parameter is the\n\
  \    same if its characters are reversed.  For example, \"abba\" is a\n    palindrome, but \"abbc\" is not a palindrome.\n\
  \n **Important**: your implementation must be recursive:\n    do not use a loop. \n\n    Think about what base case or cases\
  \ would be appropriate.\n    Make sure that your recursive call or calls make progress towards\n    a base case.\n\n   \
  \ The method should *not* ignore spaces, punctuation, or case\n    differences.  For example, \"abbA\" should *not* be considered\
  \ a\n    palindrome.\n\n    You can use the `length()` method to get the length\n    of a string.  The `charAt(int)` method\
  \ gets the character\n    at the given index in a string.  The `substring(int, int)`\n    method gets a substring from the\
  \ given start index (inclusive)\n    to the given end index (exclusive).  A correct solution will\n    probably use all\
  \ of these methods."
