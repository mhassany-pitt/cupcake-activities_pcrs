statement: "Given two string variables  `str1` and `str2`, complete the following code in order to concatenate the two strings\
  \ without including the first character of each of them. Store the resulting string in a variable called `str3`.  Assume\
  \ that the initial value of variables `str1` and `str2` is already set to a string with at least one character.\n\nE.g.\
  \ 1: if the value of `str1` is \"Hello\" and the value of `str2` is \"There\", the code prints ellohere. \nE.g. 2: if the\
  \ value of `str1` is \"java\" and the value of `str2` is \"code\", the code prints avaode. \nE.g. 3: if the value of `str1`\
  \ is \"shotl\" and the value of `str2` is \"java\", the code prints hotlava."
