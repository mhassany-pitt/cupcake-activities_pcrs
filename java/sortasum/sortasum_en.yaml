statement: "Given 2 integers, `a` and `b`, write a code to calculate their sum and store it in a variable called `sum`. However,\
  \ sums in the range 10..19 inclusive, are forbidden, so in that case, the sum should be 20. \n\nAssume that the initial\
  \ value of the variables `a` and `b` is already set to an integer.\n\nE.g. 1: if the value of `a` is 3 and the value of\
  \ `b` is 4, the value of `sum` will be 7.\nE.g. 2: if the value of `a` is 9 and the value of `b` is 4, the value of `sum`\
  \ will be 20.\nE.g. 3: if the value of `a` is 10 and the value of `b` is 11, the value of `sum` will be 21."
