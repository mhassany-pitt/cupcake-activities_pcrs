statement: |-
  Many Unix-like systems (including CDF) have a dictionary of correctly spelled words in a ﬁle. On CDF,
  here is the path to the ﬁle: /etc/dictionaries-common/words. See below some of those words (the ﬁle
  contains both capitalized and lowercase words); complete the function below, where dictionary
  refers to a ﬁle that has been opened for reading:
elements:
- type: editable
  location:
    snippet: "\ndef is_correct(dictionary, word):\n    \"\"\" (Open File for reading, str) -> bool\n    \n    Return True\
      \ iff word is a correctly-spelled word in dictionary.\n    \n    >>> dict1 = open('dict.txt', 'r')\n    >>> is_correct(dict1,\
      \ \"Zyrtec\")\n    True\n    >>> dict1.close()\n\n    >>> dict1 = open('dict.txt', 'r')\n    >>> is_correct(dict1, \"\
      lolz\")\n    False\n    >>> dict1.close()\n    \"\"\""
  placeholder: "\ndef is_correct(dictionary, word):\n    \"\"\" (Open File for reading, str) -> bool\n    \n    Return True\
    \ iff word is a correctly-spelled word in dictionary.\n    \n    >>> dict1 = open('dict.txt', 'r')\n    >>> is_correct(dict1,\
    \ \"Zyrtec\")\n    True\n    >>> dict1.close()\n\n    >>> dict1 = open('dict.txt', 'r')\n    >>> is_correct(dict1, \"\
    lolz\")\n    False\n    >>> dict1.close()\n    \"\"\""
