statement: |-
  Dadas dos variables enteras `primer_num`, `segundo_num`, escribe un programa que calcule su promedio.

  Suponga que los valores iniciales de `primer_num`, `segundo_num` estan establecidos en un valor entero.

  El promedio de los dos numeros debe almacenarse en la variable `promedio`

  Ejemplo:
  Si primer_num es 3 y segundo_num es 5, entonces el programa deberia imprimir "El promedio es 4.0"
  Si primer_num es 4 y segundo_num es 5, entonces el programa deberia imprimir "El promedio es 4.5"

