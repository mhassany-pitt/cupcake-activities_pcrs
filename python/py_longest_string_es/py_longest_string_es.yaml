statement: |-
  Escribe una funcion que tome una lista de strings y devuelva el indice de el string mas largo. Si hay multiples strings mas largas, devuelve el indice de la primera. Si la lista esta vacia, tu codigo puede fallar.

  ```
  indiceStringMasLargo(['perro', 'gato', 'a', 'ab'])=>0
  indiceStringMasLargo(['', 'a', 'ab', 'abc']) => 3
  indiceStringMasLargo(['azul', 'colegio', 'verde', 'dia'])=>1
  ```
