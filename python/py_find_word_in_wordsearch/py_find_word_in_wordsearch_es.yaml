runtime:
  language: python
  version: '3'
statement: |-
  Se te entrega una matriz de caracteres (strings de una sola letra) que representa una sopa de letras muy simple. Tu tarea es completar la función `encontrar_palabra` que determine si una palabra dada aparece en alguna fila de la matriz (de izquierda a derecha).

  No es necesario buscar en columnas, ni al revés, ni en diagonal. Solo en las filas, y solo de izquierda a derecha.

  Ejemplos entrada/salida:

  `
  sopa=[
    ['a','s','o','l'],
    ['x','y','z','w'],
    ['p','u','d','u'],
    ['r','o','m','a']
  ]
  encontrar_palabra(sopa,'sol') -> True
  encontrar_palabra(sopa,'amor') -> False
  encontrar_palabra(sopa,'pudu') -> False
  encontrar_palabra(sopa,'semaforo') -> False
  `
