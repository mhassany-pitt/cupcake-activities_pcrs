statement: Below we have provided a class RealEstateSystem which contains a collection of homes for sale and a Home class
  which contains a price instance variable. Your task is to complete the extract_minimum_price function which will return
  the lowest price of all the homes in the RealEstateSystem. If there are no homes in the system, return -1.
