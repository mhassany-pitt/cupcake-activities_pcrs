  Write a function that takes a list of ints and two ints,
  `N` and `M`, and returns the number of times
  NM occurs in order in the given list.
  For example:

  ```
  countNM([1,2,3,4,5], 2, 1) => 0
  countNM([1,2,3,4,5], 1, 2) => 1
  countNM([1,2,1,2,1], 1, 2) => 2
  countNM([-3, 8, 9, 12, 8, 12, 9], 12, 8) => 1
  ```
