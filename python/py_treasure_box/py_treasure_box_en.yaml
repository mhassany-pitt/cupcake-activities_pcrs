statement: "A treasure box with 1 million dollars inside has a lock combination that uses a 3-digit positive integer. \nTo\
  \ open the box, the following rules need to be satisfied: \n\n(1) The first digit equals the last digit.\n(2) The middle\
  \ digit is odd.\n\nWrite a program that checks single 3-digit integer and prints YES if the number opens the box and NO\
  \ otherwise.\n\nAssume that the 3-digit integer is already set to variable **`code`**.\n\nE.g. 1: if code is 212, the program\
  \ prints 'YES'\nE.g. 2: if code is 312, the program prints 'NO'\nE.g. 3: if code is 999, the program prints 'YES'\n\nAuthors:\
  \ Yana Kortsarts, Yulia Kempner, Leonid Kugel, Kamil Akhuseyinoglu"
