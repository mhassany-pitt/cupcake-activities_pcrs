statement: |-
  Escribe un programa que lea el monto total del prestamo tomado del banco, el pago inicial y el plazo del prestamo (el numero de ANOS para el cual se toma el prestamo).

  El programa calcula y muestra el pago mensual: la cantidad que el usuario necesitara pagar cada mes para devolver el prestamo.

  Ejemplo:
  Entrada: prestamo: $1200, pago inicial: $200, plazo: 1 ano (presta atencion, son 12 meses!)
  Salida: El pago mensual es $83.33
