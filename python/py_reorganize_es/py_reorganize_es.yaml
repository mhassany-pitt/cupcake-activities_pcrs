runtime:
  language: python
  version: '3'
statement: |-
  Completa la funcion `reorganizar` a continuacion que devuelve un diccionario `nuevo_dicc` que mapea llaves de string a listas de strings a partir de los datos proporcionados por el parametro `dicc_entrada`

  Las llaves en `resultado_dicc` son los strings de los valores en `orig_dicc`. Para cada llave `k` en `nuevo_dicc`, el valor correspondiente es la lista de claves en `orig_dicc` donde `k` se encontro en su lista de valores.

  Completa la funcion a continuacion incluyendo la escritura de una descripcion.
elements:
- type: editable
  location:
    snippet: "\ndef reorganizar(orig_dicc):\n    \"\"\" (dict de str a lista de str) -> dict de str a lista de str\n    \n\
      \    >>> reorganizar({'Clave1':[\"string1\", \"string2\"], 'Clave2':[\"string2\"]})\n    {'string1':['Clave1'], 'string2':['Clave1',\
      \ 'Clave2']}\n    \"\"\""
  placeholder: "\ndef reorganizar(orig_dicc):\n    \"\"\" (dict de str a lista de str) -> dict de str a lista de str\n   \
