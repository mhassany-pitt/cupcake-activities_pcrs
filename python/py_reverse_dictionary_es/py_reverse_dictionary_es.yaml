statement: Se te ha pedido que escribas una funcion que proporcione el nombre de una persona usando su numero de telefono
  ("busqueda inversa"). Esto significa que, dado un numero de telefono, obtienes el nombre de la persona que esta registrada
  con ese numero de telefono. Para este problema, se te ha pedido que escribas una solucion usando un diccionario.
