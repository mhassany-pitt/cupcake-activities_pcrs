statement: |-
  Escribe una funcion que tome un solo caracter y un numero entero (posiciones) parametros, y luego desplace el caracter adelante por el numero dado de posiciones, pasando de la 'z' a la 'a'. Para simplicidad, asume que todos los caracteres de entrada son letras minusculas. Por ejemplo:

  ```
  desplazarCaracter('a', 4) => 'e'
  desplazarCaracter('z', 1) => 'a'
  desplazarCaracter('z', 26) => 'z'
  ```
