statement: |-
  Escribe una funcion que tome un string que consiste solo en las letras mayusculas A, C, G y T, y devuelva el numero de veces que ocurre cada letra. Puedes devolver multiples valores poniendolos entre parentesis, asi:

  ```
  return (1, 2, 8, 4)
  ```

  Asegurate de devolver los conteos en el orden ACGT.
  Por ejemplo:

  ```
  contarParesDeBases('GATTACA') => (3, 1, 1, 2)
  contarParesDeBases('') => (0, 0, 0, 0)
  contarParesDeBases('GGTCAGGCCCCT') => (1, 5, 4, 2)
  ```
