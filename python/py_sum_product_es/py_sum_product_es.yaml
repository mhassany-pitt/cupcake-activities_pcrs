statement: |-
  Dado 2 enteros, `primer_num` y `segundo_num`, escribe un programa para calcular su suma y producto que se almacenan en las variables `suma` y `producto` respectivamente.

  Suponga que el valor inicial de las variables `primer_num` y `segundo_num` ya está establecido en un entero.

  Por ejemplo: si el valor de primer_num es 3 y el valor de segundo_num es 4, el valor de suma será 7 y el producto será 12

