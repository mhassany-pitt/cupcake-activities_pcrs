- type: editable
  location:
    snippet: "class Event:    \n    \"\"\"A new calendar event.\"\"\"\n\n    def __init__(self, start_time, end_time, event_name):\n\
      \        \"\"\" (Event, int, int, str) -> NoneType\n\n        Precondition: 0 <= start_time < end_time <= 23\n     \
      \   \n        Initialize a new event that starts at start_time, ends at end_time,\n        and is named name.\n\n  \
      \      >>> e = Event(12, 13, 'Lunch')\n        >>> e.start_time\n        12\n        >>> e.end_time\n        13\n  \
      \      >>> e.name\n        'Lunch'\n        \"\"\"\n        \n        self.start_time = start_time\n        self.end_time\
      \ = end_time\n        self.name = event_name\n    \n    def __str__(self):\n            \"\"\" (Event) -> str\n    \n\
      \            Return a string representation of this event.\n    \n            >>> e = Event(6, 7, 'Run')\n         \
      \   >>> str(e)\n            'Run: from 6 to 7'\n            \"\"\"\n            \n            return '{0}: from {1}\
      \ to {2}'.format(self.name, self.start_time,\n                                                 self.end_time)\n\n  \
      \  def overlaps(self, other):\n        \"\"\" (Event, Event) -> bool\n\n        Return True iff this event overlaps\
      \ with event other.\n\n        >>> e1 = Event(6, 7, 'Run')\n        >>> e2 = Event(0, 7, 'Sleep')\n        >>> e1.overlaps(e2)\n\
      \        True\n        \"\"\"\n\n        return not (other.end_time <= self.start_time \\\n                    or other.start_time\
      \ >= self.end_time)\n\nclass Day:\n    \"\"\"A calendar day and its events.\"\"\"\n\n    def __init__(self, day=1, month='January',\
      \ year=2014):\n        \"\"\" (Day, int, str, int) -> NoneType\n\n        Initialize a day on the calendar with day,\
      \ month and year,\n        and no events. \n        \n\n        >>> d = Day(5, 'April', 2014)\n        >>> d.day\n \
      \       5\n        >>> d.month\n        'April'\n        >>> d.year\n        2014\n        >>> d.events\n        []\n\
      \        \"\"\"\n\n        self.day = day\n        self.month = month\n        self.year = year\n        self.events\
      \ = []\n\n\n    def schedule_event(self, new_event):\n        \"\"\" (Day, Event) -> bool\n\n        Schedule new_event\
      \ on this day iff it does not overlap with\n        existing events.  Return True iff new_event is scheduled.\n\n\n\
      \        >>> d = Day(3, 'December', 2014)\n        >>> e = event.Event(17, 23, 'Celebrate end of classes')\n       \
      \ >>> d.schedule_event(e)\n        True\n        >>> d.events[0] == e\n        True        \n        \"\"\"\n\n    \
      \    for existing_event in self.events:\n            if existing_event.overlaps(new_event):\n                return\
      \ False\n\n        self.events.append(new_event)\n        return True\n    \n    \n    def schedule_multiple_events(self,\
      \ event_list):\n        \"\"\" (Day, list of Event) -> int\n        \n        Return the number of events in event_list\
      \ that were successfully \n        scheduled on this day, without overlapping with existing events.\n        \n    \
      \    >>> d = Day(5, 'December', 2015)\n        >>> e1 = Event(12, 16, 'Studying')\n        >>> d.schedule_event(e1)\n\
      \        True\n        >>> e2 = Event(17, 19, 'Dinner with A')\n        >>> e3 = Event(11, 13, 'Lunch with B')\n   \
      \     >>> e4 = Event(9, 10, 'Gym')\n        >>> d.schedule_multiple_events([e2, e3, e4])\n        2\n        \"\"\"\n"
