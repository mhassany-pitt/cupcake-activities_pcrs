statement: |-
  Una tienda online recibe un diccionario que representa un pedido. En este diccionario:

  -Las claves son los nombres de los productos.
  -Los valores son strings que representan el precio total del producto en pesos chilenos (por ejemplo, "1499").

  Sin embargo, algunos valores pueden estar mal ingresados (por ejemplo, "abc"). Tu tarea es sumar correctamente los precios válidos y cargar un recargo por error en el sistema (50 pesos chilenos) cuando se encuentre un precio inválido.

  Escribe una función llamada calcular_total(pedido) que:
  - Reciba un diccionario ('pedido') donde las claves son nombres de productos y los valores son strings con el total.
  - Intente convertir cada valor a int y usa try/except para manejar los distintos casos:
      - Si la conversión es exitosa, lo suma al total general.
      - Si ocurre un error, agrega 50 pesos chilenos al total como recargo por error en el sistema.
  - Devuelve el total de todos los productos válidos como un número entero

  Ejemplo entrada/salida:

  pedido={"libro": "10990", "cuaderno": "abc", "lápiz": "150x", "mochila": "40000"}
  calcular_total(pedido) -> 51090

  En este caso, el total es 51090 pues se desglosa en: 10990 (por item 'libro') + 50 (por error en item 'cuaderno') + 50 (por error en item 'lápiz') + 40000 (por item 'mochila')
