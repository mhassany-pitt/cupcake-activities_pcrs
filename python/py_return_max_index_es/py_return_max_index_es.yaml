statement: |-
  Escribe una funcion que tome una lista de enteros y devuelva el *indice* (indice, no el valor) del elemento maximo. Si el valor maximo ocurre multiples veces, devuelve el indice de la primera ocurrencia. **No** uses la funcion max(). El maximo de una lista vacia no esta definido, por lo que tu funcion puede fallar si se le da una lista vacia.

  ```
  indiceMaximo([5,5,5,5])=>0
  indiceMaximo([5,15,10,20,25])=>4
  indiceMaximo([-3,-2,-1,-6,-9,-11])=>2
  ```
