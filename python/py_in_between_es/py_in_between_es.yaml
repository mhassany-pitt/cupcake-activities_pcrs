statement: |-
  Escribe un metodo llamado estaEntre() que tome tres parametros y devuelva verdadero (True) si el primer numero esta entre los otros dos, inclusivamente, y falso (False) en el caso contrario.

  ```
  estaEntre(3, 3, 3) deberia devolver True
  estaEntre(4, 7, 9) deberia devolver False
  estaEntre(2, 1, 3) deberia devolver True
  estaEntre(2, 3, 1) deberia devolver True
  ```
