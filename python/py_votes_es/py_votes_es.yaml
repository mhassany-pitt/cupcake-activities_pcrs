statement: |-
  Se te entrega una lista de votos, donde cada voto es el nombre de un candidato (un string). Tu tarea es escribir una función que reciba esta lista como entrada y devuelva un diccionario donde las llaves sean los nombres de los candidatos y los valores sean la cantidad de votos que cada uno recibió.

  Ejemplo entrada/salida:
  conteo_votos(['Carlos', 'Ana', 'Carlos', 'Carlos', 'Ana']) -> {'Ana':2,'Carlos':3}
