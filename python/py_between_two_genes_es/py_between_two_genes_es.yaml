statement: |-
  Escribe una funcion que tome tres parametros:
  una secuencia de ADN llamada `secuencia`, un gen
  llamado `g1`, y un gen llamado `g2`.
  Devuelve todas las strings que ocurren entre una
  ocurrencia de `g1` y la ocurrencia mas cercana de
  `g2` que viene despues. Si g1 ocurre sin g2,
  devuelve el string vacia. Si hay ocurrencias adicionales de g2,
  usa la primera. Si hay ocurrencias adicionales de g1, usa
  la ultima.
  Por ejemplo:

  ```
  entreGenes('ATAATCGTGGCCA', 'AAT', 'GCCA') => 'CGTG'
  entreGenes('CGTGATCGCAATGGGGCAGTC', 'AT', 'CA') => 'CGGGGG'
  entreGenes('ATAATCGTGGCCA', 'AAT', 'GCCA') => 'CGTG'
  ```
