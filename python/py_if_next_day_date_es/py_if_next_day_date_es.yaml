statement: "Completa el siguiente programa que verifica tres enteros, que representan una fecha: mes, dia y ano, e imprime\
  \ la fecha del dia siguiente.\n\nLos valores de mes, dia y ano ya estan asignados a las variables `mes`, `dia` y `ano` respectivamente.\
  \ \nPuedes asumir que los valores de estas variables siempre son validos.\n\nLa instruccion de impresion de la fecha ya\
  \ esta proporcionada al final del programa. Para que el programa funcione correctamente, solo necesitas actualizar los valores\
  \ actuales de las variables `mes`, `dia` y `ano` a la fecha del dia siguiente.\n\nEjemplo 1: Si los tres enteros dados (mes\
  \ dia ano) son 3 30 2015, que representa la fecha real 30 de marzo de 2015, el programa deberia encontrar la fecha del dia\
  \ siguiente como 3 31 2015 (31 de marzo de 2015) e imprimirla en consecuencia.  \nEjemplo 2: Si los tres enteros dados (mes\
  \ dia ano) son 12 31 2016, que representa la fecha real 31 de diciembre de 2016, el programa deberia encontrar la fecha\
  \ del dia siguiente como 1 1 2017 (1 de enero de 2017) e imprimirla en consecuencia.\n\nPista 1: No olvides considerar el\
  \ ano bisiesto. Si el ano actual es un ano bisiesto y la fecha actual dada es 02 28 1988, la fecha del dia siguiente se\
  \ convierte en 02 29 1988 en lugar de 03 01 1988.\nEn el calendario gregoriano, un ano es bisiesto cuando el numero que\
  \ representa ese ano es divisible por 4, pero no por 100, a menos que sea divisible por 400.\n\nPista 2: Asume que no hay\
  \ anos bisiestos antes de 1582.\n\nAutores: Yana Kortsarts, Yulia Kempner, Leonid Kugel, Kamil Akhuseyinoglu"
