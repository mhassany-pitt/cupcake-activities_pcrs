statement: "Estás desarrollando un prototipo para una aplicación de música. Cada usuario tiene una lista de canciones disponibles\
  \ para reproducir (canciones). La app permite a los usuarios crear una lista de reproducción rápida eligiendo canciones\
  \ por su posición en esa lista.\n\nSin embargo, algunos usuarios cometen errores al seleccionar canciones que no existen\
  \ (índices inválidos). Para evitar que la app se detenga, debes manejar estos errores apropiadamente.\n\nEscribe una función\
  \ llamada generar_lista_reproduccion(canciones, selecciones) que reciba: \n- canciones: una lista de strings con los títulos\
  \ de las canciones disponibles.\n- selecciones: una lista de enteros con las posiciones que el usuario quiere reproducir.\n\
  \nLa función debe devolver una lista cuyos elementos sean:\n- El nombre de la canción si el índice es válido.\n- El string\
  \ \"random\" si el índice de la canción está fuera de rango (de modo que se reproduzca una canción aleatoria en ese caso)."
