statement: |-
  Escribe un programa que tome dos listas de enteros como parametros, y devuelva el numero de elementos en la segunda lista que son mayores que el promedio de la primera lista. **No** uses la funcion sum().

  ```
  numPorEncimaDelPromedio([5,5,5,5], [3,4,5,6,7])=>2
  numPorEncimaDelPromedio([5,15,10,20,25], [34, 12, 19, -1])=>2
  numPorEncimaDelPromedio([5, 7], [])=>0
  ```
