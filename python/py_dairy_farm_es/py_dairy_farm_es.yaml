statement: |-
  Una lechería envia botellas de leche utilizando contenedores de un tamano especifico. Cada contenedor contiene un cierto numero de botellas de leche.

  Complete el siguiente programa que calcula e imprime el numero de contenedores completamente llenos con botellas de leche y el numero de botellas de leche restantes.

  Suponga que el tamano de un contenedor y el numero de botellas de leche se almacenan en `tamano_contenedor` y `cantidad_botellas` respectivamente.

  Almacene el numero de contenedores completamente llenos y las botellas de leche restantes en las variables `cantidad_contenedores` y `restante` respectivamente.

  Por ejemplo, si la granja necesita enviar 118 botellas de leche y la capacidad de un contenedor es de 24 botellas, entonces 4 contenedores estaran completamente llenos y sobraran 22 botellas de leche.
  En este caso, el numero de contenedores completamente llenos es 4 y sobran 22 botella(s)

