      \    This function receives a phone number phone_num, and a dictionary\n    phone_to_name in which each key is a phone\
      \ number and each value\n    is the name associated with that phone number.\n\t\n    Return the name associated with\
      \ phone_num in phone_to_name, or\n    an empty string if there is no match.\n    \n    >>> reverse_lookup_dictionary(\"\
