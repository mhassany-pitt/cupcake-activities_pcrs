statement: "Below there is code for classes `Event` and `Day`.\n\n- Improve class `Day`'s `__init__` method.\n \n \n Update\
  \ `Day`'s  `__init__` method to add default parameter values, so that if the date isn’t speciﬁed by the caller, it is set\
  \ to January 1, 2014.\n \n\n \n\n- Improve class `Day`'s  `schedule_event` method.\n \n\n Improve method `schedule_event`\
  \ so that if we attempt to schedule an event that overlaps with an existing event, the event is not scheduled and the method\
  \ returns `False`.  Iff the event is successfully scheduled, the method should return `True`"
