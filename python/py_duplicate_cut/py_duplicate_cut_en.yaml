statement: |-
  Suppose that we have been given several candidate sequences of enzymes that we can apply to a strand to correct a mutation. We'd like to filter out sequences that are less efficient or effective. In particular, sequences that contain the same enzyme in adjacent positions are inefficient, since the enzyme will cut the same location twice.

  Complete the function `duplicate_cut` according to its docstring.
elements:
- type: editable
  location:
    snippet: |-
      def duplicate_cut(enzyme_list):
          """ (list of str) -> bool

          Return True iff the same enzyme is in the enzyme list in adjacent positions.

          >>> duplicate_cut(['EcoRI', 'Sau3A', 'Sau3A'])
          True
          >>> duplicate_cut(['EcoRI', 'Sau3A', 'EcoRI'])
          False
          """
  placeholder: |-
    def duplicate_cut(enzyme_list):
        """ (list of str) -> bool

