statement: |-
  Supongamos que se nos han dado varias secuencias candidatas de enzimas que podemos aplicar a una hebra para corregir una mutacion. Nos gustaria filtrar las secuencias que son menos eficientes o efectivas. En particular, las secuencias que contienen la misma enzima en posiciones adyacentes son ineficientes, ya que la enzima cortara el mismo lugar dos veces.

  Completa la funcion `corte_duplicado` segun su docstring.
elements:
- type: editable
  location:
    snippet: |2-

      def corte_duplicado(lista_enzimas):
          """ (lista de str) -> booleano

          Devuelve True si y solo si la misma enzima esta en la lista de enzimas en posiciones adyacentes.

          >>> corte_duplicado(['EcoRI', 'Sau3A', 'Sau3A'])
          True
          >>> corte_duplicado(['EcoRI', 'Sau3A', 'EcoRI'])
          False
          """
  placeholder: |2-

