statement: "Write a program that calculates the total monthly bill by using electric, water, and gas bills for that month.\
  \ \n\nElectric, water, and gas bills are stored in variables `electricity`, `water`, and `gas`, respectively. \nAssume that\
  \ the initial values of `electricity`, `water`, and `gas` are already set to a floating-point number. \n\nThe total monthly\
  \ bill is stored in a floating-point variable `total`. \n\nEg.:\nIf the electricity bill is 50.6, the water bill is 40.4\
  \ and the gas bill is 95.5, variable `total` should have the value of 186.5.\n\nAuthors: Yana Kortsarts, Yulia Kempner,\
  \ Leonid Kugel, Kamil Akhuseyinoglu"
