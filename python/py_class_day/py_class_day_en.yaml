      \        >>> d.day\n        5\n        >>> d.month\n        'April'\n        >>> d.year\n        2014\n        >>> d.events\n\
      \        []\n        \"\"\"\n\n        # To do: Complete this method body.\n\n    def schedule_event(self, new_event):\n\
