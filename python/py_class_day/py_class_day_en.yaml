      \      >>> e = Event(12, 13, 'Lunch')\n        >>> e.start_time\n        12\n        >>> e.end_time\n        13\n  \
      \      >>> e.name\n        'Lunch'\n        \"\"\"\n        \n        self.start_time = start_time\n        self.end_time\
      \ = end_time\n        self.name = event_name\n\n    def __str__(self):\n        \"\"\" (Event) -> str\n\n        Return\
