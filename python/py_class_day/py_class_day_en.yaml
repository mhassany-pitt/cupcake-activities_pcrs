      \       >>> e = event.Event(11, 12, 'Meeting')\n        >>> d.schedule_event(e)\n        >>> d.events[0] == e\n    \
      \    True\n        \"\"\"\n\n        # To do: Complete this method body.\n    \n    def __str__(self):\n        \"\"\
