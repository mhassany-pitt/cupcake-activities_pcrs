statement: |-
  Escribe una funcion que tome strings llamadas `secuencia` y `gen` como parametros, y devuelva el numero de veces que `gen` ocurre en `secuencia`. Por ejemplo:

  ```
  contarGenes('GATTACA', 'ATT') => 1
  contarGenes('ATCGGATCGGAAAATTACCG', 'ATCGG') => 2
  contarGenes('ATCGGATCGGAAAATTACCG', 'TTTTTTT') => 0
  ```
