statement: |-
  In math, the Collatz conjecture states that starting from any number, you will eventually obtain 1 by
  repeatedly following these two steps:
  If the number is even, divide by 2.
  If the number is odd, multiply by 3 and add 1.

  Complete this function to count Collatz steps for a particular number.
elements:
- type: editable
  location:
    snippet: |-
      def count_collatz_steps(n):
          """ (int) -> int

          Return the number of steps it takes to reach 1, by applying the two steps
          of the Collatz conjecture beginning from n.

          >>> count_collatz_steps(6)
          8
          """
