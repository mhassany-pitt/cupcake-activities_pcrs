    \    \n    >>> buscar_armario(['rojo chaqueta de verano', 'naranja chaqueta de primavera', 'rojo zapatos', 'verde sombrero'],\
    \ 'rojo')\n    ['rojo chaqueta de verano', 'rojo zapatos']\n    >>> buscar_armario(['rojo camisa', 'verde pantalones'],\
