    snippet: "\ndef estirar_string(c, factores_estiramiento):\n    \"\"\" (str, lista de int) -> str\n\n    Precondicion:\
      \ len(c) == len(factores_estiramiento) y los elementos de\n                  factores_estiramiento son mayores o iguales\
      \ a cero\n     \n    Devuelve una  string que consiste en los caracteres en c en el mismo orden que en c,\n    repetidos\
      \ el numero de veces indicado por el elemento en la posicion correspondiente\n    de factores_estiramiento.\n    \n\
