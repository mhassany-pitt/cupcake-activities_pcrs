statement: |-
  For this problem, Item and Catalog classes have been defined in the editing space.

  The Item class creates objects consisting of attributes (e.g. "style") and values (e.g. "flat"). When a new Item object is created, an id attribute is automatically assigned. Here’s an example of interacting with the class in a console:

  >>> obj = Item()
  >>> obj.id
  102
  >>> obj.style = "flat"
  >>> obj.style
  ’flat’

  Note that Python allows attributes to be assigned values with an assignment statement. In addition to id and style, possible attributes for the Item
  class include calories, color, label, name, shape, status and texture.

  The Catalog class produces objects that contain a collection of items. Here’s an example of interacting with the Item and Catalog class:

  >>> listing = Catalog()
  >>> listing.add(obj)
  >>> listing.has_style("flat")
  True
  >>> listing.has_style("twisted")
  False
  >>> listing.size()
  1

  Write a method for the Catalog class called lookup. This method should take a string as an argument to find the first object that matches
  its shape attribute. The method should then return the name of the matching Item object. For example, consider that listing is a Catalog
  object that has an Item with shape of ’round’ and name of ’apple’:

  >>> listing.lookup('round')
  'apple'

  If there is no matching object, the method should return the Python keyword None. You may assume that every object in the Catalog
  has both name and shape attributes.

  Using just the editing space below, write your definition of the lookup method so that it works as described above.
