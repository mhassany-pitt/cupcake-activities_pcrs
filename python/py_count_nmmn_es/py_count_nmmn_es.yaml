statement: |-
  Escribe una funcion que tome una lista de enteros y dos enteros, `N` y `M`, y devuelva el numero de veces que NM o MN ocurren en orden en la lista dada. Por ejemplo:

  ```
  contarNMoMN([1,2,3,4,5], 2, 1) => 1
  contarNMoMN([1,2,3,4,5], 1, 2) => 1
  contarNMoMN([1,2,1,2,1], 1, 2) => 4
  contarNMoMN([-3, 8, 9, 12, 8, 12, 9], 12, 8) => 2
  ```
