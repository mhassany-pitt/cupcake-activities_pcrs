statement: |-
  Escribe una funcion `listas_sin_interseccion` que tome dos listas como parametros. La primera lista `L1` tiene elementos que son listas de strings de texto. La segunda `L2`, es una lista de strings de texto.

  `listas_sin_interseccion` debe devolver una nueva lista que contiene las listas originales dentro de `L1` que no contienen ninguna de las strings en `L2`. Tu funcion no debe cambiar las listas originales pasadas como parametros.

  Ejemplo entrada/salida:
  listas_sin_interseccion([ ['alpha', 'beta', 'charlie'], ['delta', 'echo'], ['alpha', 'beta', 'sierra'] ], ['delta']) -> [ ['alpha', 'beta', 'charlie'], ['alpha', 'beta', 'sierra'] ]
