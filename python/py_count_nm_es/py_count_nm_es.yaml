statement: |-
  Escribe una funcion que tome una lista de enteros y dos enteros, `N` y `M`, y devuelva el numero de veces que NM ocurre en orden en la lista dada. Por ejemplo:

  ```
  contarNM([1,2,3,4,5], 2, 1) => 0
  contarNM([1,2,3,4,5], 1, 2) => 1
  contarNM([1,2,1,2,1], 1, 2) => 2
  contarNM([-3, 8, 9, 12, 8, 12, 9], 12, 8) => 1
  ```
