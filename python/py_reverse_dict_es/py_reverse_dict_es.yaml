statement: |-
  Escribe una funcion que invierta un diccionario, cambiando las llaves por valores, y los valores por llaves. Debido a que las llaves de un diccionario deben ser unicas, puedes asumir que los valores tambien son unicos. Por ejemplo:

  ```
  invertirDiccionario({1:2}) => {2:1})
  invertirDiccionario({1:2, 3:4}) => {2:1, 4:3})
  invertirDiccionario({1:2, 3:4, 7:7, 9:6}) => {2:1, 7:7, 4:3, 6:9})
  ```
  "
