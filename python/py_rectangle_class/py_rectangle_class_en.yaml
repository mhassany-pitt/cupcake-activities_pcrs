statement: "DO NOT USE THE WORD `input` ANYWHERE! \n\nWe provide class `Rectangle` and starter code for class `RectangleCollection`.\
  \ \n\nComplete class `RectangleCollection`, which has one list instance variable, `rectangles`, that should initially refer\
  \ to an empty list.  Write a method `add_rectangle` that takes a `Rectangle` as a parameter and appends it to the rectangles\
  \ list.  Write a method `get_same_area_rects` that takes a number as a parameter and returns a list of all `Rectangle`s\
  \ from the rectangles list that have that area."
