statement: "In the Gregorian calendar, a year is a leap year when the number representing that year is divisible by 4, but\
  \ not by 100, unless it is divisible by 400. \n\nThus years such as 1996, 1992, 1988 and so on are leap years because they\
  \ are divisible by 4 but not by 100. For century years, the 400 rule is important. Thus, century years 1900, 1800 and 1700,\
  \ while all still divisible by 4, are also divisible by 100. As they are not further divisible by 400, they ARE NOT leap\
  \ years. \n\nOn the other hand, the year 2000 is a leap year since it is divisible by 4 and 100 but also by 400. Also, you\
  \ can assume that there were no leap years before 1582. \n\nWrite a program that checks whether or not a given year is a\
  \ leap year and returns True or False accordingly.\n\nAssume that the value of the year is already set to a variable **`year`**.\n\
  \nE.g. 1: If the year is 1980, then leap_year is True\nE.g. 2: If the year is 1900, then leap_year is False\nE.g. 3: If\
  \ the year is 1200, then leap_year is False\nE.g. 4: If the year is 2000, then leap_year is True\nE.g. 5: If the year is\
  \ 3000, then leap_year is False\n\nAuthors: Yana Kortsarts, Yulia Kempner, Leonid Kugel, Kamil Akhuseyinoglu"
