statement: |-
  Una matriz diagonal es una matriz cuadrada donde todos los elementos fuera de la diagonal principal son cero. La diagonal principal de una matriz está formada por los elementos matrix[i][i].

  Tu tarea es completar la funcion `es_matriz_diagonal` que determine si una matriz cuadrada dada es una matriz diagonal o no.

  Ejemplos de entrada/salida:
  `matriz1 = [
      [3, 0, 0],
      [0, -2, 0],
      [0, 0, 5]
  ]
  es_matriz_diagonal(matriz1) -> True
  `

  `matriz2 = [
      [4, 2, 0],
      [0, -2, 0],
      [1, 0, 5]
  ]
  es_matrix_diagonal(matriz2) -> False
  `

  A considerar:
  - La matriz siempre será cuadrada.
  - No utilices librerías externas como NumPy.
  - Usa estructuras básicas de Python (list, range, etc.).
