statement: |-
  En matematicas, la conjetura de Collatz establece que comenzando desde cualquier numero, eventualmente se obtendra 1 al seguir repetidamente estos dos pasos:
  Si el numero es par, dividir por 2.
  Si el numero es impar, multiplicar por 3 y sumar 1.

  Completa esta funcion para contar los pasos de Collatz para un numero en particular.
elements:
- type: editable
  location:
    snippet: |-
      def contar_pasos_collatz(n):
          """ (int) -> int

          Devuelve el numero de pasos que toma llegar a 1, aplicando los dos pasos
          de la conjetura de Collatz comenzando desde n.

          >>> contar_pasos_collatz(6)
          8
          """
