statement: |-
  The `User` class represents a user with a username, password, and account information.

  Complete the `update_account` method in the code below according to its docstring description. Call the `login` method in your solution.
elements:
- type: editable
  location:
    snippet: "class User:\n    \n    def __init__(self, username, password, account_info):\n        \"\"\" (User, str, str,\
      \ str) -> NoneType\n        \n        Initialize the user with username, password, and account_info.\n        \n   \
      \     >>> new_user = User('xyz', 'password1', \"Bob's Online Banking\")\n        >>> new_user.username\n        'xyz'\n\
      \        >>> new_user.password\n        'password1'\n        >>> new_user.account_info\n        \"Bob's Online Banking\"\
      \n        \"\"\"\n        self.username = username\n        self.password = password\n        self.account_info = account_info\n\
      \        \n    def login(self, entered_password):\n        \"\"\" (User, str) -> bool\n        \n        Return True\
      \ iff the user's password matches entered_password.\n        \n        >>> new_user = User('xyz', 'password1', \"Bob's\
      \ Online Banking\")\n        >>> new_user.login('password1')\n        True\n        >>> new_user.login('1234')\n   \
      \     False\n        \"\"\"\n        return self.password == entered_password\n\n    def update_account(self, entered_password,\
      \ new_info):\n        \"\"\" (User, str, str) -> NoneType\n        \n        Modify the user's account_info to be new_info\
      \ if the user's password\n        matches entered_password.\n        \n        >>> new_user = User('xyz', 'password1',\
      \ \"Bob's Online Banking\")\n        >>> new_user.update_account('1234', 'B.O.B.')\n        >>> new_user.account_info\n\
      \        \"Bob's Online Banking\"\n        >>> new_user.update_account('password1', 'B.O.B.')\n        >>> new_user.account_info\n\
      \        'B.O.B.'\n        \"\"\""
