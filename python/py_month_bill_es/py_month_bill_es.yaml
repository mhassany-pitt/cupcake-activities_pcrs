statement: "Escribe un programa que calcule la factura mensual total utilizando las facturas de electricidad, agua y gas para\
  \ ese mes.\n\nLas facturas de electricidad, agua y gas se almacenan en las variables `electricidad`, `agua` y `gas`, respectivamente.\
  \ \nSuponga que los valores iniciales de `electricidad`, `agua` y `gas` ya están establecidos como un número de punto flotante.\n\
  \nLa factura mensual total se almacena en una variable de punto flotante `total`.\n\nEj.:\nSi la factura de electricidad\
  \ es 50.6, la factura de agua es 40.4 y la factura de gas es 95.5, la variable `total` debería tener el valor de 186.5.\n\
  \nAutores: Yana Kortsarts, Yulia Kempner, Leonid Kugel, Kamil Akhuseyinoglu"
