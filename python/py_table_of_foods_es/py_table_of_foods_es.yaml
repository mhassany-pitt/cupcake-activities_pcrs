statement: |-
  Eres un cocinero en un restaurante ocupado. Estas escribiendo un programa para ayudarte a organizar cuanto de cada tipo de comida necesitas cocinar. Naturalmente, decides tomar un descanso de cocinar y escribir una funcion para ayudar. Decides que tu funcion tomara un diccionario como parametro donde las claves son las mesas en el restaurante y los valores son listas de strings describiendo la comida que cada mesa ha ordenado. Tu funcion devuelve un diccionario con los totales de cuanta cantidad de cada articulo de comida necesitas cocinar.

  Por ejemplo, digamos que tienes 5 mesas y 3 platos:

  Mesas: m1, m2, m3, m4 y m5

  Platos: Estofado vegetariano, Pastel de carne, Poutine

  **Entrada:**

  Usaras los nombres de las mesas como las claves, y usaras una lista de las comidas ordenadas en cada mesa como valores.

  Por ejemplo, tu diccionario puede verse asi:

  ```
  {'m1': ['Estofado vegetariano', 'Poutine', 'Estofado vegetariano'],
   'm3': ['Pastel de carne', 'Poutine', 'Estofado vegetariano'],
   'm4': ['Pastel de carne', 'Pastel de carne']}
  ```

  **Salida:**

  Tu funcion debe devolver un diccionario con el plato como la llave, y el numero de veces que ese plato fue ordenado como el valor. Dada la entrada anterior, tu funcion crearia y devolveria un diccionario equivalente al siguiente:

  `{'Estofado vegetariano': 3, 'Poutine': 2, 'Pastel de carne': 3}`

  Aqui hemos comenzado el codigo para ti. Completalo:
