  Escribe una funcion que tome una lista de enteros como parametro y devuelva el numero de veces que 7 aparece directamente antes de 9 en la lista.
  Por ejemplo:

  ```
  contar79([1,2,7,8,9]) => 0
  contar79([1,2,7,9,8,9,7,9]) => 2
  contar79([7,9,7,9,7,9,7]) => 3
  ```
