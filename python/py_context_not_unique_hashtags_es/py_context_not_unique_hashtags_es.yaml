statement: |-
  En este problema, escribiremos una funcion `contiene_sin_hashtags_unicos` que toma dos listas como parametros. La primera lista, `hashtags_tweet`, contiene listas de strings. Cada lista representa los hashtags encontrados en un solo tweet. La segunda lista, `hashtags_unicos`, es una lista de hashtags utilizados unicamente por un candidato especifico.

  `contiene_sin_hashtags_unicos` debe devolver una nueva lista de las listas de hashtags para aquellos tweets (de la lista original) que **no pueden** ser atribuidos al candidato. Un tweet no puede ser atribuido al candidato si no utiliza ninguno de los hashtags unicos utilizados por el candidato.

  Tu funcion no debe cambiar las listas originales pasadas como parametros.

  Ejemplo entrada/salida:

  contiene_sin_hashtags_unicos([['politica', 'eleccion'], ['futbol', 'deporte'], ['eleccion', 'voto']],['voto'])  -> [['politica', 'eleccion'], ['futbol', 'deporte']]
