statement: |-
  Write a function that takes a list of ints as a parameter
  and returns the number of times that 7 occurs directly before
  9 in the list.
  For example:

  ```
  count79([1,2,7,8,9]) => 0
  count79([1,2,7,9,8,9,7,9]) => 2
  count79([7,9,7,9,7,9,7]) => 3
  ```
