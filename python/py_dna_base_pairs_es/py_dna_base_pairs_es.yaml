statement: |-
  Escribe una funcion que tome un string como parametro, y devuelva True si el string es un string de ADN (es decir, solo contiene las letras mayusculas A, C, G, T), y False en caso contrario. un string de ADN debe tener al menos 1 caracter de longitud, por lo que el string vacia no es un string de ADN. Por ejemplo:

  ```
  esstringADN('GATTACA') => True
  esstringADN('GATTACA 2: El Regreso de Ethan Hawke') => False
  esstringADN('') => False
  ```
