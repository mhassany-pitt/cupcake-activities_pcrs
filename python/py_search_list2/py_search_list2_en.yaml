    snippet: "def search_closet(items, colour):\n    \"\"\" (list of str, str) -> list of str\n    \n    items is a list containing\
      \ descriptions of the contents of a closet where\n    every description has the form 'colour item', where each colour\
      \ is one word\n    and each item is one or more word.  For example:\n\n        ['grey summer jacket', 'orange spring\
      \ jacket', 'red shoes', 'green hat']\n\n    colour is a colour that is being searched for in items. \n    \n    Return\
      \ a list containing only the items that match the colour.\n    \n    >>> search_closet(['red summer jacket', 'orange\
      \ spring jacket', 'red shoes', 'green hat'], 'red')\n    ['red summer jacket', 'red shoes']\n    >>> search_closet(['red\
      \ shirt', 'green pants'], 'blue')\n    []\n    >>> search_closet([], 'mauve')\n    []\n    \"\"\""
