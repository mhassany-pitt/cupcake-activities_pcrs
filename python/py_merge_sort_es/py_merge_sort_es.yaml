statement: |-
  # Fusion de arreglos ordenados

  *GTG 14.1*
  Dado arreglos ordenados `arr1` y `arr2` de longitudes `n` y `m` respectivamente, devuelve un arreglo `out` que contiene la union de los elementos de ambos arreglos, sin ningun duplicado.

  - Usa `fuerza bruta` para establecer rapidamente el paso de casos de prueba

  - Usa `busqueda binaria` para buscar en `arr1` (el mayor de los dos) entre insertar el elemento en `arr2` en `out`

  # Ejemplo

  `[1, 1]`, `[]` -> `[1]`
  `[1]`, `[2]` -> `[1, 2]`
  `[1, 2]`, `[2]`, -> `[1, 2]`
  `[3, 4]`, `[1, 2]` -> `[1, 2, 3, 4]`
  `[3, 4, 4]`, `[1, 1, 2]` -> `[1, 2, 3, 4]`
  `[1, 2, 3, 6, 7, 8]`, `[4, 4]` -> `[1, 2, 3, 4, 6, 7, 8]`
