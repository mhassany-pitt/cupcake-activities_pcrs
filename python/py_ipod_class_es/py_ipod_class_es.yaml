statement: |-
  Hemos comenzado a escribir una clase para gestionar la biblioteca de musica de un iPod. Para modelar esto, hemos creado un codigo inicial para una clase que utiliza un diccionario para almacenar la musica usando el nombre del artista como clave y una lista de sus canciones como valor.

  Complete el siguiente codigo donde se indica.
