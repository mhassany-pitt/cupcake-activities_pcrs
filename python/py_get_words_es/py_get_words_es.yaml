statement: |-
  Completa la funcion obtener_palabras que necesitara leer las palabras en el archivo de texto 'archivo' y que retorne una lista de todas las palabras que conforman el texto en su mismo orden de aparicion. La variable `archivo` representa un archivo abierto para lectura. Puedes usar el metodo `str` `split` para hacer tu lista.

  Completa la funcion a continuacion segun la descripcion de su docstring.
