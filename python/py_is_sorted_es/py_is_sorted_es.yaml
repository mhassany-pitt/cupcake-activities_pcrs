statement: |-
  Escribe una funcion que tome una lista de enteros y devuelva True si la lista esta ordenada de menor a mayor, y False en caso contrario. Suponga que una lista vacia esta ordenada. Por ejemplo:

  ```
  estaOrdenada([1,2,3,4,99, 123, 2342]) => True
  estaOrdenada([1,2,3,4,999, 50, 2342]) => False
  estaOrdenada([]) => True
  ```
