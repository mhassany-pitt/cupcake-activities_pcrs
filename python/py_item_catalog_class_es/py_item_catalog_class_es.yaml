statement: |-
  Para este problema, las clases Item y Catalog han sido definidas en el espacio de edicion.

  La clase Item crea objetos que consisten en atributos (por ejemplo, "estilo") y valores (por ejemplo, "plano"). Cuando se crea un nuevo objeto Item, se asigna automaticamente un atributo id. Aqui hay un ejemplo de interaccion con la clase en una consola:

  >>> obj = Item()
  >>> obj.id
  102
  >>> obj.estilo = "plano"
  >>> obj.estilo
  'plano'

  Tenga en cuenta que Python permite que los atributos se les asignen valores con una declaracion de asignacion. Ademas de id y estilo, los posibles atributos para la clase Item incluyen calorias, color, etiqueta, nombre, forma, estado y textura.

  La clase Catalog produce objetos que contienen una coleccion de items. Aqui hay un ejemplo de interaccion con la clase Item y Catalog:

  >>> listado = Catalog()
  >>> listado.agregar(obj)
  >>> listado.tiene_estilo("plano")
  True
  >>> listado.tiene_estilo("torcido")
  False
  >>> listado.tamano()
  1

  Escriba un metodo para la clase Catalog llamado busqueda. Este metodo debe tomar un string como argumento para encontrar el primer objeto que coincida con su atributo forma. Luego, el metodo debe devolver el nombre del objeto Item que coincide. Por ejemplo, considere que listado es un objeto Catalog que tiene un Item con forma de 'redondo' y nombre de 'manzana':

  >>> listado.busqueda('redondo')
  'manzana'

  Si no hay ningun objeto que coincida, el metodo debe devolver la palabra clave de Python None. Puede asumir que cada objeto en el Catalog tiene tanto atributos de nombre como de forma.

  Usando solo el espacio de edicion a continuacion, escriba su definicion del metodo busqueda para que funcione como se describe arriba.
