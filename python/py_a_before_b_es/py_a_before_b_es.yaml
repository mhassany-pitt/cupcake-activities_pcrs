statement: |-
  Verificar si todas las instancias de el string a aparecen antes de el string b. Devuelve True si todas las instancias de A estan antes de B.

  ```
  aAntesDeB("gatos gatos gatos perros perros", "gatos", "perros") -> True
  aAntesDeB("gatos gatos perros gatos perros", "gatos", "perros") -> False
  aAntesDeB("perros gatos gatos gatos perros", "gatos", "perros") -> False
  aAntesDeB("gatos perros", "gatos", "perros") -> True
  ```
