statement: |-
  Escribe una función que reciba un número entero positivo mayor que 1 y retorne su factor más pequeño mayor que 1.
  Instrucciones:

  - Un factor de un número n es cualquier número que lo divide exactamente (es decir, sin dejar residuo).
  - Debes retornar el factor más pequeño que sea mayor que 1.
  - Puedes asumir que la entrada siempre será un número mayor que 1.

  Usa un ciclo while en tu solución.

  Ejemplos de entrada/salida:
  factor_menor(15) -> 3
  factor_menor(24) -> 2
  factor_menor(49) -> 7
