statement: |-
  Dado dos numeros enteros, `num1` y `num2`, completa el siguiente codigo que calcula el cuociente (resultado de la division de num1 por num2), el cuociente entero (division entera de num1 por num2), y el resto (residuo de la division de num1 por num2).

  Asume que los valores iniciales de `num1` y `num2` ya estan establecidos.

  El cuociente, cuociente entero y resto (o residuo) deben almacenarse en las variables `cuociente`, `cuociente_entero`, y `residuo` respectivamente.

  Ej. 1: Si el valor de `num1` es 25 y `num2` es 5, el codigo imprime ""El cociente es 5.0 el cociente entero es 5 y el residuo es 0.0""
  Ej. 2: Si el valor de `num1` es 14 y `num2` es 4, el codigo imprime ""El cociente es 3.5 el cociente entero es 3 y el residuo es 2.0""

  Autores: Yana Kortsarts, Yulia Kempner, Leonid Kugel, Kamil Akhuseyinoglu
