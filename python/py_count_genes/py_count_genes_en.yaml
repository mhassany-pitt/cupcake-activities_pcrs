statement: |-
  Write a function that takes strings named `seq`
  and `gene` as parameters, and returns the number
  of times that `gene` occurs in `seq`.
  For example:

  ```
  countGenes('GATTACA', 'ATT') => 1
  countGenes('ATCGGATCGGAAAATTACCG', 'ATCGG') => 2
  countGenes('ATCGGATCGGAAAATTACCG', 'TTTTTTT') => 0
  ```
