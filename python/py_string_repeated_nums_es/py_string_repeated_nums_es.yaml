statement: |-
  Estás desarrollando una función para generar un patrón de números repetidos. Tu tarea es escribir una función que reciba dos números enteros, 'inicio' y 'fin', y que retorne un único string que contenga cada número del rango (inicio a fin, inclusive) repetido tantas veces como su valor, todo concatenado en una sola línea.

  Crea una función llamada generar_string_repetidos(inicio, fin) que:
  - Recorra todos los números desde inicio hasta fin (inclusive).
  - Para cada número, lo repita tantas veces como su valor.
  - Devuelva un string único con todos los números repetidos concatenados.
  - Asuma que inicio y fin seran ambos mayores o igual a 1
  - Si bien puede resolverlo usando ciclo while, use ciclo for para escribir su respuesta

  Nota: No debe haber espacios ni saltos de línea en el string final.
