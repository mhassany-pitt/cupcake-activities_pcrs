statement: |-
  "Completa el siguiente programa que calcula e imprime el costo total de la estancia en el hotel basado en el numero de noches, el precio por noche y el porcentaje de impuesto.

  Asume que el numero de noches, el precio por noche y el porcentaje de impuesto se almacenan en las variables `noches`, `precio`, y `impuesto` respectivamente.

  Almacena el costo total en la variable `total` como un numero de punto flotante.

  Por ejemplo, si la persona se quedo 3 noches, con $99.99 por noche y un impuesto del 14.5%, el programa imprime ""El costo total es 343.47""

  Autores: Yana Kortsarts, Yulia Kempner, Leonid Kugel, Kamil Akhuseyinoglu"
