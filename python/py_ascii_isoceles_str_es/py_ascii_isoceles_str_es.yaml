statement: |-
  Escribe una función `triangulo_ascii(bloque, lado)` que retorne una cadena de texto que represente un triángulo rectángulo isósceles en ASCII, utilizando el carácter `bloque`, con una base y altura de `lado` caracteres. El ángulo recto debe estar en la esquina superior izquierda.

  Precondición: len(bloque) == 1

  Por ejemplo, si `bloque="@"` y `lado=4`, la función debe retornar la siguiente cadena (con un salto de línea al final de cada fila):
  @@@@
  @@@
  @@
  @
