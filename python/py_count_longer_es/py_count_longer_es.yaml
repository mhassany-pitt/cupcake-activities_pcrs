statement: |-
  Escribe una funcion que tome una lista de strings y un string, y devuelva el numero de strings en la lista que son mas largas que el string dada.

  ```
  contarStringsMasLargos(['perro', 'gato', 'a', 'ab'], 'z')=>3
  contarStringsMasLargos(['', 'a', 'ab', 'abc'], 'abcd') => 0
  contarStringsMasLargos(['azul', 'colegio', 'fracaso', 'dia'], 'abril')=>2
  ```
