statement: A continuacion, hemos proporcionado una clase SistemaDeBienesRaices que contiene una coleccion de casas en venta
  y una clase Casa que contiene una variable de instancia precio. Tu tarea es completar la funcion extraer_precio_minimo que
  devolvera el precio mas bajo de todas las casas en el SistemaDeBienesRaices. Si no hay casas en el sistema, devuelve -1.
