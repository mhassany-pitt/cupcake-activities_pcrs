statement: |-
  Write a function that takes a positive integer greater than 1 and returns its smallest factor greater than 1.

  Instructions:

  - A factor of a number n is any number that divides n evenly (no remainder).
  - You must return the smallest factor that is greater than 1.
  - You can assume the input will always be greater than 1.

  Use a while loop in your solution.

  Examples of input/output:

  smallest_factor(15) -> 3
  smallest_factor(24) -> 2
  smallest_factor(49) -> 7
