  \ by the given number of letters,\nwrapping around from a back around z. For simplicity, assume all input chars\nare lower-case\
  \ letters. \n\nNote that this it is harder to shift backwards than\nforwards. You may need to add extra multiple of 26 so\n\
  that you don't get back a negative value when subtracting\noff the key.\n\nFor example:\n\n```\nunshiftChar('a', 4) => 'w'\n\
  unshiftChar('z', 1) => 'y'\nunshiftChar('z', 26) => 'z'\n```"
