statement: |-
  Se te ha pedido que escribas una funcion que proporcione el nombre de "busqueda inversa" para la persona asociada con un numero de telefono. Esto significa que dado un numero de telefono, obtienes el nombre de la persona que esta registrada con ese numero de telefono. Escribe esta funcion usando listas paralelas.

  Completa las siguientes funciones:
elements:
- type: editable
  location:
    snippet: "def busqueda_inversa_listas(num_telefono, numeros_telefono, nombres):\n    \"\"\" (str, lista de str, lista\
      \ de str) -> str\n\n    Precondicion: len(numeros_telefono) == len(nombres)\n\n    Esta funcion recibe un numero de\
      \ telefono num_telefono, y dos listas: una lista de \n    numeros de telefono numeros_telefono y una lista de nombres\
      \ nombres. Estas listas son\n    listas paralelas, por lo que el nombre en la posicion 0 de la lista de nombres esta\
      \ \n    asociado con el numero de telefono en la posicion 0 de la lista numeros_telefono, y asi sucesivamente.\n\n \
      \   Devuelve el nombre asociado con num_telefono segun numeros_telefono\n    y nombres, o un string vacia si no hay\
      \ coincidencia.\n    \n    >>> busqueda_inversa_listas('416-555-6543', ['416-555-3498', \\\\\n        '647-555-9812',\
      \ '416-555-6543', '905-555-6681'], ['John A. Macdonald', \\\\\n        'Louis Riel', 'Canoe Head', 'Tim Horton'])  \
      \      \n    'Canoe Head'\n    \"\"\""
  placeholder: "def busqueda_inversa_listas(num_telefono, numeros_telefono, nombres):\n    \"\"\" (str, lista de str, lista\
    \ de str) -> str\n\n    Precondicion: len(numeros_telefono) == len(nombres)\n\n    Esta funcion recibe un numero de telefono\
    \ num_telefono, y dos listas: una lista de \n    numeros de telefono numeros_telefono y una lista de nombres nombres.\
    \ Estas listas son\n    listas paralelas, por lo que el nombre en la posicion 0 de la lista de nombres esta \n    asociado\
    \ con el numero de telefono en la posicion 0 de la lista numeros_telefono, y asi sucesivamente.\n\n    Devuelve el nombre\
    \ asociado con num_telefono segun numeros_telefono\n    y nombres, o un string vacia si no hay coincidencia.\n    \n \
    \   >>> busqueda_inversa_listas('416-555-6543', ['416-555-3498', \\\\\n        '647-555-9812', '416-555-6543', '905-555-6681'],\
    \ ['John A. Macdonald', \\\\\n        'Louis Riel', 'Canoe Head', 'Tim Horton'])        \n    'Canoe Head'\n    \"\"\""
