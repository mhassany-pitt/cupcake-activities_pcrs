statement: "A grocery store sells perishable and nonperishable food.  Each item in the store has a bar code, a 9-digit positive\
  \ integer. The bar code of perishable items ends with 3, 4, or 7. \n\nWrite a program that checks one integer, the barcode\
  \ of a single item, whether the item is perishable or not. The variable, perishable, is True if it is perishable, and false\
  \ otherwise. \nIf the given integer is not a 9-digit positive integer, then perishable should be False.\n\nAssume that the\
  \ barcode value is already stored in a variable called **`barcode`**.\n\nE.g. 1: If the barcode is 342564643, perishable\
  \ is True since the barcode finishes with 3.\nE.g. 2: If the barcode is 442554645, perishable is False since the barcode\
  \ finishes with 5.\nE.g. 3: If the barcode is 325, perishable is False since the barcode is not a 9-digit integer.\n\nAuthors:\
  \ Yana Kortsarts, Yulia Kempner, Leonid Kugel, Kamil Akhuseyinoglu"
